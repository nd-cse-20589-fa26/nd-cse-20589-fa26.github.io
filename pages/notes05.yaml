  ## Python: <span class="gold">Anagrams</span> (<i class="muted">count_letters</i>)

  ```python
  def count_letters(string: str) -> dict[str, int]:
      ''' Returns a dictionary containing counts of each letter in string

      >>> count_letters('aaa bb c')
      {'a': 3, 'b': 2, 'c': 1}
      '''
      counts = {}                       # Discuss: counting pattern

      for letter in string:
          if not letter.isspace():      # Discuss: isspace
              if letter in counts:
                  counts[letter] += 1
              else:
                  counts[letter]  = 0   # Discuss: get method
              # counts[letter] = counts.get(letter, 0) + 1

      return counts
  ```

  ```bash
  # Demonstrate: testing specific function
  $ doctestfn anagram.py count_letters -v
  ```

  ## Python: <span class="gold">Anagrams</span> (<i class="muted">is_anagram</i>)

  ```python
  def is_anagram(word1: str, word2: str) -> bool:
      ''' Returns whether or not word1 and word2 are anagrams

      >>> is_anagram('dormitory', 'dirty room')
      True

      >>> is_anagram('asdf', 'asdfg')
      False
      '''

      counts1 = count_letters(word1)
      counts2 = count_letters(word2)

      # Discuss: items(), formatting
      for letter, counts in count1.items():
          print(f'{count:>7} {word}')

      return counts1 == counts2
  ```

  ## Python: <span class="gold">Anagrams</span> (<i class="muted">main</i>)

  ```python
  def main(arguments=sys.argv[1:], stream=sys.stdin) -> None:
      # Parse command-line options
      ignorecase = False

      # Discuss: popping from queue
      while arguments and arguments[0].startswith('-'):
          match argument := arguments.pop(0):
              case '-i': ignorecase = True
              case '-h': usage(0)
              case _   : usage(1)

      # Process standard input
      for line in stream:
          if ignorecase:
              line = line.lower()

          # Discuss: splitting string
          word1, word2 = line.split()
          if is_anagram(word1, word2):
              print('ANAGRAM!')
          else:
              print('NOT ANAGRAM!')
  ```

