  ## Python: <span class="gold">Fizz Buzz</span> (<i class="muted">Arguments, Types</i>)

  ```python
  import sys
  ...                                     # Discuss: types
  def fizzbuzz(start: int=1, stop: int=100) -> None:
  ...

  def main(arguments: list[str]=sys.argv[1:]) -> None:
      # Version 1: no checks
      start = arguments[0]                # Demonstrate: mypy
      end   = arguments[1]

      # Version 2: try/except
      try:
          start = int(arguments[0])
      except IndexError:                  # Discuss: exceptions
          start = 1

      try:
          end = int(arguments[1])
      except IndexError:
          end = 100

      # Version 3: ternary
      start = int(arguments[0]) if len(arguments) >= 1 else 1
      end   = int(arguments[1]) if len(arguments) >= 2 else 100

      fizzbuzz(start, end)
  ```

