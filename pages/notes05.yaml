  ## Python: <span class="gold">Fizz Buzz</span> (<i class="muted">Functions</i>)

  ```python
  $ $EDITOR fizzbuzz.py
  #!/usr/bin/env python3

  def fizzbuzz(start=1, stop=100):        # Discuss: keyword arguments
      for number in range(start, stop + 1):
          if number % 3 == 0 and number % 5 == 0:
              print('FizzBuzz')
          elif number % 3 == 0:
              print('Fizz')
          elif number % 5 == 0:
              print('Buzz')
          else:
              print(number)

  fizzbuzz(1, 20)
  fizzbuzz()                              # Discuss: default arguments
  fizzbuzz(end=5)
  fizzbuzz(end=5, start=2)
  ```

