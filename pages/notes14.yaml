  ### Overview

  - <strong class="special">Programming Paradigms</strong>: Take ideas and
  apply them.

  - <strong class="success">Functional Programming</strong> is something you
  already know (*Unix Philosophy*).

  > Challenge today is <strong class="info">Multi-Core</strong> World: <strong
  class="success">Functional Programming</strong> is a way to harness these
  resources by **restructuring our programs**.

  ## Object-oriented Programming: <span class="gold">Class</span>

  <strong class="info">Object-oriented programming</strong> is a <strong
  class="special">programming paradigm</strong> that encourages combining
  <strong class="primary">functions</strong> with their associated <strong
  class="caution">data</strong>.

  ```python
  # Discuss: Class as templates

  class Person:
      # Discuss: Constructor
      def __init__(self, first: str, last: str):
          self.first = first
          self.last  = last

  # Review: tuple

  People = (
      Person('Peter'      , 'Parker'),
      Person('Mary Jane'  , 'Watson'),
      Person('Gwen'       , 'Stacy'),
      Person('Peter'      , 'Bui'),
      Person('Joshua'     , 'Bui'),
  )

  # Review: number of people, first, last

  print(len(People))
  print(People[0])
  print(People[-1])

  # Review: sorting -> Error because no __lt__

  for p in sorted(People):
      print(p.first, p.last)
  ```

  ## Review: <span class="gold">Sorting, Lambda</span>

  To quickly define short <strong class="primary">functions</strong>, we can
  use the [lambda] expression which allows us to create one-line <strong
  class="primary">functions</strong> that consist of a single <strong
  class="caution">expression</strong>.

  ```python

  def last_name(p):
      return p.last

  print(last_name(People[-1]))

  # Sort by last name

  for p in sorted(People, key=last_name):
      print(p.first, p.last)

  # Sort by last name using lambda

  for p in sorted(People, key=lambda p: p.last):
      print(p.first, p.last)

  # Sort by last name then first name using lambda

  for p in sorted(People, key=lambda p: (p.last, p.first):
      print(p.first, p.last)

  # Sort after defining __lt__

  class Person:
      ...
      # Discuss: Magic/Dunder methods
      def __lt__(self, other):
          if self.last == other.last:
              return self.first < other.first
          return self.last < other.last

  for p in sorted(People):
      print(p.first, p.last)
  ```

  [lambda]: https://docs.python.org/3/reference/expressions.html#lambda
  [lambdas]: https://docs.python.org/3/reference/expressions.html#lambda

  ## Review: <span class="gold">Requests, CSV</span>

  ```python
  #!/usr/bin/env python3

  import csv
  import requests

  URL = 'https://yld.me/raw/hqQS.csv'
  MAX = 40

  # Review: Fetching Data

  data = requests.get(URL).text.splitlines()

  # Compute Individual Scores - Imperative
  # Discuss: csv.reader, high-level goal
  # Discuss: common pattern

  scores = []
  for student in csv.reader(data):
      points = []
      for point in student:
          points.append(float(point))
      scores.append(sum(points))

  print(sum(scores))
  ```

  ## Functional Programming: <span class="gold">Map</span>

  To transform a <strong class="caution">sequence</strong> into another <strong
  class="caution">sequence</strong>, we can use the [map] <strong
  class="primary">higher order function</strong>:

  ```python
  map(func, seq)
  ```

  <div class="alert info-bg centered" markdown="1">

  [map] takes a <strong class="primary">function</strong> `func` <strong
  class="success">applies</strong> it to each of the elements in the <strong
  class="caution">sequence</strong> `seq`.

  </div>

  ```python
  # Compute Individual Scores - Functional v1
  # Discuss: map, generator

  scores = []
  for student in csv.reader(data):
      points = sum(map(float, student))
      scores.append(points)

  print(sum(scores))

  # Compute Individual Scores - Functional v2

  scores = map(
      lambda student: sum(map(float, student)),
      csv.reader(data)
  )

  print(sum(scores))
  ```

  [map]: https://docs.python.org/3/builtins/functions.html#map

  ## Functional Programming: <span class="gold">List Comprehensions</span>

  Because [map] and [filter] is so common and [lambdas] can be a bit tricky to
  use, <strong class="success">Python</strong> provides some <strong
  class="special">syntactic sugar</strong> called [list comprehensions] which
  allow us to concisely construct new [lists].

  ```python
  # List Comprehension Structure

  list_comprehension = [
      element
      for element in seq
      if condition
  ]
  ```

  [list comprehensions]: https://docs.python.org/3/tutorial/datastructures.html#list-comprehensions
  [lists]: https://docs.python.org/3/builtins/stdtypes.html#typesseq-list

  ```python
  # Compute Individual Scores - List Comprehension v1
  # Discuss: list comprehension

  scores = [
      sum(map(float, student))
      for student in csv.reader(data)
  ]

  print(sum(scores))

  # Compute Individual Scores - List Comprehension v2

  scores = [
      sum([float(point) for point in student])
      for student in csv.reader(data)
  ]

  print(sum(scores))
  ```

  ## Functional Programming: <span class="gold">Filter</span>

  To traverse a <strong class="caution">sequence</strong> of values and <strong
  class="warning">extract</strong> a few particular values, <strong
  class="success">Python</strong> provides the [filter] function:

  ```python
  filter(func, seq)
  ```

  <div class="alert info-bg centered" markdown="1">

  [filter] takes a <strong class="primary">function</strong> `func` <strong
  class="success">applies</strong> it to each of the elements in the <strong
  class="caution">sequence</strong> `seq`.  If the result is `True`, then the
  element is included in the resulting <strong class="caution">sequence</strong>.

  </div>

  ```python
  # Filter scores - Imperative

  Bs = []
  for score in scores:
      if .8*MAX <= score < .9*MAX:
          Bs.append(score)

  print(len(Bs))

  # Filter scores - Functional

  Bs = filter(lambda score: .8*MAX <= score < .9*MAX, scores)
  print(len(list(Bs)))

  # Filter scores - List Comprehension

  Bs = [score for score in scores if .8*MAX <= score < .9*MAX]
  print(len(Bs))
  ```

  [filter]: https://docs.python.org/3/builtins/functions.html#filter

  ## Functional Programming: <span class="gold">Paradigms</span>

  <table class="bordered">
  <thead>
    <th class="danger-bg">Imperative</th>
    <th class="success-bg">Functional</th>
  </thead>
  <tbody>
    <tr>
      <td class="danger-bg">Programs as a <strong class="danger">sequence</strong> of instructions</td>
      <td class="success-bg">Programs as a <strong class="success">composition</strong> of functions (<strong class="caution">2</strong>)</td>
    </tr>
    <tr>
      <td class="danger-bg"><strong class="danger">Change state</strong> and <strong class="danger">mutate</strong> data (<i>variables<i>)</td>
      <td class="success-bg"><strong class="success">Minimize</strong> state and side-effects (<i>idempotent</i>) (<strong class="caution">1</strong>)</td>
    </tr>
    <tr>
      <td class="danger-bg"><strong class="danger">Explicitly enumerate order</strong> of operations</td>
      <td class="success-bg"><strong class="success">Transform</strong> streams of data (<strong class="caution">3</strong>)</td>
    </tr>
  </tbody>
  </table>

  ## Functional Programming: <span class="gold">Implicit Concurrency</span>

  If we modify our programs to use a <strong class="success">functional
  programming</strong> approach via [map], we get <strong
  class="success">concurrency</strong> as a <strong
  class="danger">side-effect</strong> for free:

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  ```python
  # Instead of this
  for item in stream:
      compute(item)
  ```

  <br>

  <div class="alert danger-bg centered" markdown="1">

  <i>Inherently **sequential**</i>

  </div>

  </div>

  <div class="flex-col" markdown="1">

  ```python
  # Do this
  map(compute, stream)
  ```

  <br>
  <br>

  <div class="alert success-bg centered" markdown="1">

  <i>Possibly **concurrent**</i>

  </div>

  </div>

  </div>

  ## Functional Programming: <span class="gold">Data Parallelism</span>

  <strong class="success">Functional programming</strong> maps well to problems that exhibit
  [data parallelism]:

  <div class="centered">

  <img src="static/img/slides16-data-parallelism.svg" class="transparent responsive">

  </div>

  > <strong class="warning">Concurrent</strong> execution of the <strong
  > class="success">same task</strong> across the elements of a <strong
  > class="caution">dataset</strong>.

  <div class="alert warning-bg centered" markdown="1">

  In such situations, the <strong class="caution">dataset</strong> normally
  exhibits [data independence], meaning each element can be processed <strong
  class="special">independently</strong> of the other.

  </div>

  [data parallelism]: https://en.wikipedia.org/wiki/Data_parallelism
  [data independence]: https://en.wikipedia.org/wiki/Data_independence

  ## Functional Programming: <span class="gold">Concurrent Futures</span>

  Once our program is structured to use [map], we can use the
  [concurrent.futures] module to perform <strong class="danger">parallel</strong>
  execution:

  ```python
  import hashlib
  import os
  import concurrent.futures
  import sys

  # Hash Function

  def sha1sum(p):
      with open(p) as stream:
          return hashlib.sha1(stream.read().encode()).hexdigest()

  # Create a pool of processes and compute hash in parallel

  arguments = sys.argv[1:]

  with concurrent.futures.ProcessPoolExecutor(4) as executor:
      hashes = executor.map(sha1sum, arguments)

  for p, h in zip(arguments, hashes):
      print(f'{h}  {p}')
  ```

  [concurrent.futures]: https://docs.python.org/3/library/concurrent.futures.html
