  ## Review: <span class="gold">System Calls, Files</span>

  1.  <div class="flex-col" markdown="1">

      What is a <strong class="warning">system call</strong>?

      > A <strong class="info">system call</strong> occurs when a <strong
      class="success">user application</strong> requests a <strong
      class="warning">service, operation, or resource</strong> from the <strong
      class="danger">operating system kernel</strong>.

  2.  <div class="flex-col" markdown="1">

      How would you track the <strong class="warning">system calls</strong>
      used by a program?

      > `strace`

  3.  <div class="flex-col" markdown="1">

      What <strong class="warning">system call</strong> would you use to get
      the <strong class="special">inode</strong> information about a <strong
      class="success">file</strong>?

          :::python
          >>> inode = os.stat(path)

          >>> inode = Path(path).stat()

  ## Directories: <span class="gold">Overview</span>

  As with <strong class="success">files</strong>, <strong
  class="caution">directories</strong> are also represented by <strong
  class="special">inodes</strong> in the <strong class="warning">file
  system</strong>.

  -   <div class="flex-col" markdown="1">

      Each <strong class="caution">directory</strong> contains:

      - References to itself (`.`) and its <strong
        class="warning">parent</strong> (`..`)

      - References to other <strong class="special">inodes</strong> (ie. <strong
        class="comment">entries</strong>)

  -   <div class="flex-col" markdown="1">

      Each <strong class="success">process</strong> tracks its <strong
      class="caution">current working directory</strong>:

          :::python
          # Get current working directory of process
          >>> os.getcwd()

  ## Directories: <span class="gold">Operations</span>

  Many of the <strong class="warning">file system</strong> operations we might
