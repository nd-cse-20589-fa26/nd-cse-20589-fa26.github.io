title:      "Reading 04: Networking, Pipelines, Filters"
body:       |

  **Everyone**:

  Next week, we will unlock the true power of the **Unix philosophy** by
  studying how to combine common **Unix** utilities together to form
  sophisticated **pipelines** for filtering text.  Additionally, we will also
  review how to wield [regular expressions] to create nifty pattern matching
  tools.

  <div class="alert info-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "book" | embed_icon }}</i> TL;DR

  The focus of this reading is to revisit [regular expressions] while exploring
  [filters] and [pipelines].

  </div>

  [filters]: https://en.wikipedia.org/wiki/Filter_(software)#Unix
  [pipelines]: https://en.wikipedia.org/wiki/Pipeline_(Unix)
  [regular expressions]: https://en.wikipedia.org/wiki/Regular_expression

  ## Readings

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  The readings for this week are:

  1.  <div class="flex-col">

      [The Linux Command Line]

      - Chapter 16 - Networking
      - Chapter 19 - Regular Expressions
      - Chapter 20 - Text Processing

  </div>

  <div class="flex-col" markdown="1">

