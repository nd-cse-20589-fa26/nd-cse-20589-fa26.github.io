title:      "Homework 03: Weather, Campus"
body:       |

  The goal of this homework assignment is to allow you to practice writing
  [Python] scripts that either extract data using [regular expressions] or
  manipulate structured data in [JSON] format.  In each script, you will build
  on your knowledge of [data structures] such as [lists] and [dicts] to process
  data you fetch via [HTTP] using [requests].

  For this assignment, record your scripts and any responses to the following
  activities in the `homework03` folder of your **assignments** [GitHub]
  repository and push your work by **noon Saturday, September 12**.

  [Python]: https://www.python.org/
  [data structures]: https://en.wikipedia.org/wiki/Data_structure
  [list]: https://docs.python.org/3/library/stdtypes.html#list
  [lists]: https://docs.python.org/3/library/stdtypes.html#list
  [dicts]: https://docs.python.org/3/library/stdtypes.html#dict
  [dict]: https://docs.python.org/3/library/stdtypes.html#dict
  [Unix]: https://en.wikipedia.org/wiki/Unix
  [regular expressions]: https://en.wikipedia.org/wiki/Regular_expression
  [HTTP]: https://en.wikipedia.org/wiki/HTTP
  [requests]: https://requests.readthedocs.io/

  ## Activity 0: Preparation

  Before starting this homework assignment, you should first perform a `git
  pull` to retrieve any changes in your remote [GitHub] repository:

      :::bash
      $ cd path/to/repository                   # Go to assignments repository

      $ git switch master                       # Make sure we are in master branch

      $ git pull --rebase                       # Get any remote changes not present locally

  Next, create a new branch for this assignment:

      :::bash
      $ git switch -c homework03                # Create homework03 branch and check it out

  ### Task 1: Skeleton Code

  To help you get started, the instructor has provided you with the following **skeleton code**:

      ::bash
      # Go to homework03 folder
      $ cd homework03

      # Download Makefile
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20589.fa26/static/txt/homework03/Makefile

      # Download Python skeleton code
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20589.fa26/static/txt/homework03/weather.py
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20589.fa26/static/txt/homework03/campus.py

  Once downloaded, you should see the following files in your `homework03` directory:

      :::bash
      homework03
          \_ Makefile     # This is the Makefile building all the assignment artifacts
          \_ campus.py    # This is the Python script for the campus script
          \_ weather.py   # This is the Python script for the weather script

  <div class="alert warning-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "alert" | embed_icon }}</i> DocTests

  You may notice that in addition to the usual comments and `TODOs`, the
  [docstrings] of each method also contains a few [doctests].

  You are **not** to modify these [doctests] and must keep them in-place. They
  are used to verify the correctness of your code.

  Your code goes **below** the [docstrings], where the `TODO` and `pass`
  commands are (you may remove the pass once you complete the method).

  </div>

  [docstrings]: https://peps.python.org/pep-0257/
  [doctests]: https://docs.python.org/3/library/doctest.html

  ### Task 2: Initial Import

  Now that the files are downloaded into the `homework03` folder, you can
  **commit** them to your [git] repository:

      :::bash
      $ git add Makefile                            # Mark changes for commit
      $ git add *.py
      $ git commit -m "Homework 03: Initial Import" # Record changes

  ### Task 3: Unit Tests

  After downloading these files, you can run the `make` command to run the
  tests.

      :::bash
      # Run all tests (will trigger automatic download)
      $ make

  You will notice that the Makefile downloads these additional test data and scripts:

      :::bash
      homework03
          \_ campus.test  # This is the Python test for the campus script
          \_ weather.test # This is the Python test for the weather script

  In addition to the embedded [doctests] in the **skeleton code**, you will be
  using these [unit tests] to verify the correctness and behavior of your code.

  <div class="alert info-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "download" | embed_icon }}</i> Automatic Downloads

  The `test` scripts are automatically downloaded by the `Makefile`, so any
  modifications you do to them will be lost when you run `make` again. Likewise,
  because they are automatically downloaded, you do not need to `add` or `commit`
  them to your [git] repository.

  </div>

  The details on what you need to implement for this assignment are described
  in the following sections.

  ## Activity 1: Weather (*0.4 Points*)

  Michael is not amused by heat and humidity on campus and longs for the cool
  breeze of Fall.  Obsessed with the weather, he compulsively checks
  [weather.gov], which is a website by the [National Weather Service].  While
  checking the weather for the fifth time on his phone during class, he
  realized that he could actually apply some of the things he is learning in
  class to his current obsession.

  For example, he realized that he can fetch the weather information for any
  [zipcode], using the following [URL]:

      :::bash
      $ curl -sL https://forecast.weather.gov/zipcity.php?inputstring=$ZIPCODE

  For instance, the weather information for Notre Dame, Indiana can be
  retrieved using:

      :::bash
      $ curl -sL https://forecast.weather.gov/zipcity.php?inputstring=46556

  Looking at the data retrieved from the website, he notices that the forecast
  and temperature information is wrapped in [HTML] fields that contain the text
  "myforecast":

      :::html
      ...
      <p class="myforecast-current">Overcast</p>
      <p class="myforecast-current-lrg">37&deg;F</p>
      <p class="myforecast-current-sm">3&deg;C</p>
      ...

  Michael wants to make a [Python] script `weather.py` that will fetch the
  weather information for any specified [zipcode] and extract the temperature
  and forecast.  Unfortunately, despite taking AP Computer Science in high
  school, he is still a bit confused about using [requests] to fetch [HTTP]
  data and [re] to extract data using [regular expressions].

  You decide that you could use some practice with [Python] and [regular
  expressions], and so you help him complete the `weather.py` script such that
  it behaves as follows:

      :::bash
      # Display usage message
      $ ./weather.py -h
      Usage: weather [-c] ZIPCODE
          -c    Use Celsius degrees instead of Fahrenheit for temperature

      If zipcode is not provided, then it defaults to 46556.

      # Display temperature and forecast for default ZIPCODE (46556)
      $ ./weather.py
      Temperature: 78°F
      Forecast:    Fair

      # Display temperature and forecast for Orange, CA (92867)
      $ ./weather.py 92867
      Temperature: 69°F
      Forecast:    NA

      # Display temperature and forecast for Eau Claire, WI (54701) in Celsius
      $ ./weather.py -c 54701
      Temperature: 28°C
      Forecast:    Fair

  The `weather.py` script takes the following possible flags:

  - `-c`: This allows the user to specify that the <b>temperature</b> should be displayed in <b>Celsius</b> rather than <b>Fahrenheit</b>.

  If the user specifies an unknown flag, then the program should print the
  usage message and exit with a failure status.

  After the flags, the `weather.py` script accepts one positional argument as
  the `ZIPCODE`.  If none is given, then `46556` is used by default.

  [weather.gov]: https://www.weather.gov/
  [National Weather Service]: https://www.weather.gov/
  [zipcode]: https://en.wikipedia.org/wiki/ZIP_Code
  [URL]: https://en.wikipedia.org/wiki/URL
  [re]: https://docs.python.org/3/library/re.html

  ### Task 1: `weather.py`

  To build this script, you will need to complete the `weather.py` [Python] script
  by implementing the following functions:

  1.  <div class="flex-col" markdown="1">

      `weather(zipcode: int, url: str=WEATHER_URL, celsius: bool=False) -> tuple[Optional[str], Optional[str]]`

      > This function fetches the weather information for `zipcode`, extracts
      the `temperature` and `forecast`, and returns both.  If `celsius` is
      `True`, then it returns the `temperature` in <b>Celsius</b>; otherwise,
      it returns the degrees in <b>Fahrenheit</b>.

      <div class="alert success-bg" markdown="1">

      **Hint**: Use [requests.get] to fetch the data via [HTTP] and then use
      [re.findall] or [re.search] to extract the <b>temperature</b> and
      <b>forecast</b> information using [regular expressions].

      </div>

  2.  <div class="flex-col" markdown="1">

      `main(arguments: list[str]=sys.argv[1:]) -> None`

      > This function processes the command-line `arguments` to determine
      whether or not the <b>temperature</b> should be in <b>Celsius</b> or
      <b>Fahrenheit</b> and which <b>ZIPCODE</b> to use (if none is specified
      then use `46556`).  Afterwards, it uses the `weather` function to
      retrieve the <b>temperature</b> and <b>forecast</b> information and then
      prints them both out.

      <div class="alert success-bg" markdown="1">

      **Hint**: You can use the following format strings to print out the
      <b>temperature</b> and <b>forecast</b>:

          :::python
          f'Temperature: {temperature}'
          f'Forecast:    {forecast}'

      </div>

  [requests.get]: https://requests.readthedocs.io/en/latest/api/#requests.get
  [re.findall]: https://docs.python.org/3/library/re.html#re.findall
  [re.search]: https://docs.python.org/3/library/re.html#re.search

