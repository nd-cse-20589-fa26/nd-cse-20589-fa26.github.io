  ## Activity 2: Campus (*0.4 Points*)

  It's been a while since Anna has been on campus.  With so much construction
  in the last few years, it is difficult for even recent alumni to identify and
  locate all the buildings.  Fortunately, [Notre Dame Creative] provides a
  [Campus Map] with an [API] that returns [JSON] data.

  For example, accessing the following [URL] will give all the information
  about buildings named `dillon`:

      :::bash
      # Fetch JSON data about "dillon"
      $ curl -sL https://map.nd.edu/placemarks.json?q=dillon
      [{"id":86,"name":"Dillon Hall","permanent_uid":"1030","geometry": ...]

  As can been seen, this [JSON] object is quite large and complex... That said,
  the [API] is nice in that it allows users to query buildings by <b>name</b>
  or by <b>tags</b> such as `tour` or `gameday`.

  Seeing the potential in helping alumni navigate campus, Anna wants your help
  in writing a `campus.py` script in [Python] that fetches this [JSON] data
  using [requests] and then outputs the results in a more simplified format.

  Now that you have gotten some more practice with [Python], you feel confident
  in your abilities to slice and dice [data structures] such as [dicts] and
  [lists], so you decided to help Anna write the `campus.py` script with the
  following behavior:

      :::bash
      # Display usage message
      $ ./campus.py
      Usage: campus [-n LIMIT -t TAGS] NAME
          -n LIMIT    Only display up to LIMIT results
          -t TAGS     Search for specified TAGS

      You may either search by NAME or by TAGS, but not both at the same time.

      # Search for buildings named cushing
      $ ./campus.py cushing
         1. Cushing Hall of Engineering (125) [building,core]

            Opened in 1933, the exterior is embellished with the names of
            history's great scientists and engineers, as well as traditional
            engineering tools. The lobby includes intricate mosaics and a
            ceiling decorated with botanical and geometric forms.

      # Search for buildings tagged as food and gameday
      $ ./campus -t food,gameday
         1. Bond Hall (79) [tour,gameday,food,building,core]

            Built in 1917, Bond Hall was originally the university library.
            Besides its library, auditorium, computer lab and studio space,
            the hall’s main staircase serves as the platform for the Notre
            Dame Marching Band’s game-day concerts.

      # Search for buildings named debartolo (limit results to 2)
      $ ./campus -n 2 debartolo
         1. DeBartolo Hall (102) [tour,commencement,building,core]

            This is an all-purpose classroom building. When it was built in
            1992, it more than doubled Notre Dame’s classroom space with 84
            classrooms, lecture halls and auditoriums. Just inside the main
            entrance (the middle pavilion) is a statue of the Virgin Mary.
            It is the original version of "Our Lady of the Universe", carved
            by Rev. Anthony Lauck.

        2. DeBartolo Hall: East - North (588) [a11y,entrance_a11y,core]

            DeBartolo Hall accessible entrance East - North

  The `campus.py` script takes the following possible flags:

  - `-n`: This allows the user to specify the maximum number of results to show
  (default is `5`).

  -   <div class="flex-col" markdown="1">

      `-t`: This allows the user to specify a list of <b>tags</b> (ie. *comma
      separated*) to match rather than a <b>name</b>.

      <div class="alert warning-bg" markdown="1">

      **Note**: You should attempt to **match all tags** (ie. `AND`).

      </div>


  After the flags, the `campus.py` script accepts one positional argument as
  the `NAME` to search.

  If the user does not specify a <b>NAME</b> or any <b>TAGS</b>, then the
  program should print the usage message and exit with a failure status.

  [Notre Dame Creative]: https://creative.nd.edu/
  [Campus Map]: https://map.nd.edu/
  [API]: https://creative.nd.edu/services/web/website-design-development/apis/campus-map/

  ### Task 1: `campus.py`

  To build this utility, you will need to complete the `campus.py` [Python]
  script by implementing the following functions:

  1.  <div class="flex-col" markdown="1">

      `clean_description(html: str) -> str:`

      > This function *cleans* the `html` description by doing the following:
      > removing images, removing links, replacing newlines with spaces,
      > removing [HTML] tags, and stripping the final result.

      <div class="alert success-bg" markdown="1">

      **Hint**: You may want to use multiple instances of [re.sub] and [str.replace].

      </div>

  2.  <div class="flex-col" markdown="1">

      `campus(query: str, tags: list[str], limit: int=5) -> None`

      > This function uses the [API] provided by [Campus Map] to search for
      either buildings matching `query` or buildings matching **all** of the
      `tags`.

      It displays up to `limit` results in the following format:

          :::python
          f'{index:4}. {placemark_name} ({placemark_id}) [{placemark_tags}]\n\n{placemark_description}'

      <div class="alert success-bg" markdown="1">

      **Hints**: You can use [str.join] to combine the list of `tags` into a single string.

      Likewise, to have the description wrap nicely, you can use [textwrap.wrap] as follows:

          :::python
          placemark_description = f'\n'.join(textwrap.wrap(
              clean_description(placemark['description']),
              initial_indent    = INDENT,
              subsequent_indent = INDENT,
          ))

      This uses [textwrap.wrap] to split the long description into a [list] of
      strings, and then recombines these indented strings back into a single
      description.

      To handle printing blank lines between entries (*rather than after each
      entry*), take a look at the approach used in the [wikipedia.py] example
      discussed in class.

      </div>

  3.  <div class="flex-col" markdown="1">

      `main(arguments: list[str]=sys.argv[1:]) -> None`

      > This function processes the command-line `arguments` to determine which
      `NAME` or `TAGS` to use to query the [API] of the [Campus Map] and then
      calls `campus` to output up to `LIMIT` results.

      <div class="alert success-bg" markdown="1">

      **Hint**: You can use [list.extend] to add an entire [list] to the end of another [list].

      </div>

  [re.sub]: https://docs.python.org/3/library/re.html#re.sub
  [str.join]: https://docs.python.org/3/library/stdtypes.html#str.join
  [str.replace]: https://docs.python.org/3/library/stdtypes.html#str.replace
  [textwrap.wrap]: https://docs.python.org/3/library/textwrap.html#textwrap.wrap
  [wikipedia.py]: https://github.com/nd-cse-20589-fa26/examples/blob/master/slides09/wikipedia.py
  [list.extend]: https://docs.python.org/3/library/stdtypes.html#sequence.extend

