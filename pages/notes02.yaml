title:  "Notes 02: Git"
body:   |

  ## Logistics

  - **Office hours** with **TAs** maybe sporadic this week, times still being
  finalized.

  - **Overview**: Review what [git] is and how to use it to submit [Reading 01]
    (**note**: there is a **grace period**).
  
  - **Canvas**: nothing to submit ([GitHub] only).

  - **Python3**: make sure to use provided `python3` otherwise, there could be
  issues (*one fixed this morning*)

  [git]: https://git-scm.com/
  [Reading 01]: reading01.html
  [GitHub]: https://github.com

  ## SSH: <span class="gold">Model</span>

  <div class="centered">

  <img src="static/img/slides02-ssh-model.png" class="responsive transparent">

  </div>

  - **Local** terminal is just an **interface** for **remote** process (**bash**).

  - **NFS** is used to share files between machines (same **file system**).

  - **Student machines** used for **testing** and **grading** (*but you can use
  your local computer if you wish*).

  - **Firewall**: use **VPN** when off campus.

  ## Git: <span class="gold">Concepts</span>

  <strong class="primary">Git</strong> is a free and open source <strong
  class="cm">distributed version control system</strong> designed to
  handle everything from small to very <strong class="danger">large projects
  </strong>with speed and efficiency.

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  - <strong class="success">Journal (*record transactions, diary*)</strong>

  - <strong class="caution">Time Machine (*checkout different versions*)</strong>

  - <strong class="special">Shared Space (*use for collaborating with TAs*)</strong>

  </div>

  <div class="flex-col-25 centered" markdown="1">

  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Git-logo.svg/330px-Git-logo.svg.png" class="transparent">

  </div>

  </div>

