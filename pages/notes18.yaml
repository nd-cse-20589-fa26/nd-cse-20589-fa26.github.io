  ## Review: <span class="gold">Object-Oriented Programming</span>

  -   <div class="flex-col" markdown="1">

      What is [object-oriented programming]? Why use it?

      > - Solve problems by using **abstraction**, **encapsulation**,
      **polymorphism**, and **inheritance**.

      > - Hide complexity, promote code re-use, and model the world.

  -   <div class="flex-col" markdown="1">

      What is the <strong class="warning">context manager protocol</strong>?
      Why use it?

      > Allows us to use the `with` statement to allocate a resource and
      automatically release it when the statement is done.

  [object-oriented programming]: https://en.wikipedia.org/wiki/Object-oriented_programming

  ## Process: <span class="gold">Overview</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  A <strong class="success">process</strong> is a **loaded** instance of a
  program; it is a unit of <strong class="warning">allocation</strong>
  (*resources*, *privileges*, etc.).

  - <strong class="success">Memory Address Space</strong>: code, data, heap,
    stack.

  - <strong class="caution">Kernel State</strong>: permissions, file descriptors,
    etc.

  - <strong class="info">Execution Context</strong>: program counter, stack
    pointer, data registers.

  <div class="alert warning-bg" markdown="1">

  In [Homework 05], when we created a `concurrent.futures.ProcessPoolExecutor`,
  we were allocating multiple <strong class="success">processes</strong> so we
  can `smash` passwords in **parallel**.

  </div>

  </div>

  <div class="flex-col-25" markdown="1">

