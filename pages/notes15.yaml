  ## Iterators: <span class="gold">Iterables</span>

  ```python
  # Discuss: iterable is anything you can loop over

  for ta in ['evan', 'kathryn', 'loise', 'will', 'hailey']:
      print(ta)

  # Discuss: loop over any sequence

  for c in 'will':
      print(c)

  # Review: loop through dictionary

  for key, value in os.environ.items():
      print(key, value)

  # Review: loop through file

  for line in open('/etc/passwd'):
      print(line.rstrip())
  ```

  <div class="alert warning-bg centered" markdown="1">

  How does <strong class="success">Python</strong> know it is done
  **iterating**?

  </div>

  ## Iterators: <span class="gold">Protocol</span>

  ```python
  >>> r = range(5)            # Range object
  >>> r
  range(0, 5)

  >>> i = iter(range(5))      # Explicitly create iterator
  >>> i
  <range_iterator object at 0x7efc43d663a0>

  >>> next(i)                 # Get next item from iterator
  ...
  >>> next(i)                 # Exception when we run out
  StopIteration
  ```

  ## Iterators: <span class="gold">Not a List</span>

  ```python
  >>> r = reversed(range(5))  # Reverse iterator Range object
  >>> r
  <range_iterator object at 0x7efc439a0bd0>

  >>> for i in r: print(i)
  ...
  >>> for i in r: print(i)    # Already consumed!

  >>> r = reversed(range(5))
  >>> r[0]                    # IndexError

  >>> r = list(reversed(range(5)))
  >>> r[0]                    # IndexError
  ```

  ## Iterators: <span class="gold">Protocol</span> (<i class="muted">OOP</i>)

  ```python
  #!/usr/bin/env python3

  class Countdown:

      # Review: Constructor
      def __init__(self, n: int=10):
          self.n = n

      # Discuss: iter()
      def __iter__(self):
          return self

      # Discuss: next()
      def __next__(self):
          if self.n == 0:
              raise StopIteration
          self.n -= 1
          return self.n

  countdown = Countdown()
  print(next(countdown))
  print(next(countdown))
  print()

  for c in countdown:
      print(c)
  ```

  ## Generators: <span class="gold">Lazy Evaluation</span> (<i class="muted">Skit</i>)

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  ### List

  - **TA** grades exams one at a time
  - **TA** puts graded exams into buffer (box)
  - **TA** then passes whole box to next grader

  </div>

  <div class="flex-col" markdown="1">

  ### Generator

  - **TA** grades exams one at a time
  - **TA** passes exams to next **grader**

  <div class="alert success-bg" markdown="1">

  - **Concurrency** / **Pipelining**!

  - Less memory usage (*no DS*)

  </div>

  </div>

  </div>

  With a <strong class="success">generator</strong>, we perform <strong
  class="warning">lazy evaluation</strong>:

  1. Start evaluation of <strong class="primary">function</strong> until we
  reach [yield] statement.

  2. When we reach the [yield] statement, suspend or pause the <strong
    class="primary">function</strong> and return the <strong
    class="caution">expression</strong> to the caller.

  3. When the <strong class="primary">function</strong> is called again, resume
  or continue where we left off.

  [yield]: https://docs.python.org/3/reference/simple_stmts.html#yield


  ```python
  # Discuss:
  #   - return finishes a function
  #   - yield suspends function, gives back result, and we resume when called
  #     again
  def triples(sequence: Iterable[Any]) -> Iterator[Any]:
      for i in sequence:
        yield i * 3   # Discuss: Suspend, Give, later Resume

      # Generator expression
      return (i*3 for i in sequence)
  ```

  ## Generators: <span class="gold">Task Parallelism</span>

  <strong class="success">Generators</strong> support problems that exhibit [task
  parallelism]:

  <img src="static/img/slides16-task-parallelism.svg" class="transparent responsive">

  > <strong class="warning">Concurrent</strong> execution of the <strong
  > class="success">different tasks</strong> on same or different <strong
  > class="caution">datasets</strong>.

  <div class="alert warning-bg centered" markdown="1">

  In such situations, the <strong class="warning">different tasks</strong>
  usually must <strong class="danger">communicate</strong> and <strong
  class="danger">coordinate</strong> with each other.<br>The <strong
  class="warning">concurrent</strong> execution of such tasks are <strong
  class="special">interleaved</strong> throughout the execution of the
  application.

  </div>

  [task parallelism]: https://en.wikipedia.org/wiki/Task_parallelism

  ## Generators: [Reading 05]

  ```python
  def odds_fp(stream=sys.stdin) -> Iterator[int]:
      return filter(lambda n: n % 2, map(int, stream))

  def odds_lc(stream=sys.stdin) -> list[int]:
      return [int(n) for n in stream if int(n) % 2]

  def odds_gr(stream=sys.stdin) -> Iterator[int]:
      for line in stream:
          number = int(line)
          if number % 2:
              yield number

  def odds_ge(stream=sys.stdin) -> Iterator[int]:
      return (n for n in map(int, stream) if n % 2)
  ```

  [Reading 05]: reading05.html
