  ## Review: <span class="gold">Functional Programming</span>

  -   <div class="flex-col" markdown="1">

      What is a **programming paradigm**?

      > A way of **problem solving** based on certain **principles**.

  -   <div class="flex-col" markdown="1">

      What is **functional programming**?

      > Construct programs as a **composition** of **functions** that
      **transform streams**.

  ## Functional Programming: <span class="gold">Data Parallelism</span>

  <strong class="success">Functional programming</strong> maps well to problems
  that exhibit [data parallelism]:

  <div class="centered">

  <img src="static/img/slides16-data-parallelism.svg" class="transparent responsive">

  </div>

  > <strong class="warning">Concurrent</strong> execution of the <strong
  > class="success">same task</strong> across the elements of a <strong
  > class="caution">dataset</strong>.

  <div class="alert warning-bg centered" markdown="1">

  In such situations, the <strong class="caution">dataset</strong> normally
  exhibits [data independence], meaning each element can be processed <strong
  class="special">independently</strong> of the other.

  </div>

  [data parallelism]: https://en.wikipedia.org/wiki/Data_parallelism
  [data independence]: https://en.wikipedia.org/wiki/Data_independence

  ```python
  #!/usr/bin/env python3

  import hashlib
  import os
  import sys

  # Hash Function

  def sha1sum(path: str):
      ''' Compute sha1sum digest of the contents of path. '''
      try:    # Discuss: rb, hashlib
        with open(path, 'rb') as stream:
              return hashlib.sha1(stream.read()).hexdigest()
      except OSError:
          pass

  # Compute sha1sum of all arguments
  # Review: arguments, imperative
  arguments = sys.argv[1:]

  # Version 0: Imperative
  digests = []
  for argument in arguments:
      digests.append(sha1sum(argument))

  # Version 1: List comprehension
  digests = [sha1sum(argument) for argument in arguments]

  # Version 2: Functional Programming
  digests = map(sha1sum, arguments)

  # Version 3: Functional Programming (with Parallelism)
  with concurrent.futures.ProcessPoolExecutor() as executor:
      digests = executor.map(sha1sum, arguments)

  # Display sha1sum of all arguments
  # Discuss: zip -> iterator
  for argument, digest in zip(arguments, digests):
      print(f'{digest}  {argument}')
  ```

