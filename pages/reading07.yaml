title:      "Reading 07: System Calls, File System"
body:       |

  **Everyone**:

  Next week, we will continue exploring [system calls] and low level functions.
  In particular, we will explore system calls related to [files],
  [directories], and [I/O] and discuss how many of the utilities we use every
  day are implemented.

  <div class="alert info-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "book" | embed_icon }}</i> TL;DR

  The focus of this reading is to explore [system calls] and low-level
  functions related to [files], [directories], and [I/O] in [Python].

  </div>

  [system calls]: https://en.wikipedia.org/wiki/System_call
  [files]: https://en.wikipedia.org/wiki/Computer_file
  [directories]: https://en.wikipedia.org/wiki/Directory_(computing)
  [I/O]: https://en.wikipedia.org/wiki/Input/output

  ## Readings

