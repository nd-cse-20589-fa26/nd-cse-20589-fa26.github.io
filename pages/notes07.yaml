  ## Regular Expressions: <span class="gold">Overview</span>

  > [grep] and [sed] are examples of [Unix] tools (aka. *filters*) that use
  [regular expressions] to search text for **patterns**.

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  <div class="centered" markdown="1">

  A <strong class="success">regular expression</strong> (*aka. <strong
  class="success">regex</strong>*) is a sequence of characters that defines a
  search **pattern** that is used to match text.

  </div>

      :::bash
      # Use grep to search with regular expression
      $ grep -E '2[0-9]*8' /etc/passwd

  </div>

  <div class="flex-col" markdown="1">

  <img src="static/img/slides07-regex-theory.svg" class="transparent">

  </div>

  </div>

