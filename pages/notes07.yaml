  ## Review: <span class="gold">Unix Philosophy</span>

  <div class="centered" markdown="1">

  Write programs that <strong class="success">do one thing</strong> and <strong
  class="success">do it well</strong>.

  <br>

  Write programs that <strong class="success">work together</strong>.

  <br>

  Write programs that <strong class="success">handle text streams</strong>,
  because that is a universal interface.

  </div>

  > We've experienced this power in the previous assignments...

  ```bash
  # Get all the users running a process on the current system
  $ ps aux | cut -d ' ' -f 1

  # Count all the processes
  $ ps aux | wc -l

  # Count all the processes per user
  $ ps aux | cut -d ' ' -f 1 | sort | uniq -c
  ```

