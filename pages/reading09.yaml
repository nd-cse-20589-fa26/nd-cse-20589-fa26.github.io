  ## Submission

  To submit you work, follow the same process outlined in [Reading 01]:

      :::bash
      $ git add answers.json                # Mark changes for commit
      $ git commit -m "Reading 09: Quiz"    # Record changes
      $ git push -u origin reading09        # Push branch to GitHub

  <div class="alert warning-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "lifebuoy" | embed_icon }}</i> Acknowledgments

  If you collaborated with any other students, or received help from TAs or AI
  tools on this assignment, please record this support in the `README.md` in
  the `reading09` folder and include it with your **Pull Request**.

  </div>

  <div class="alert success-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "account-question" | embed_icon }}</i> Graders

  Once you have committed your work and pushed it to [GitHub], remember to
  create a **pull request** and assign it to the appropriate **teaching
  assistant** from the [Reading 09 TA List].

  **Note**: this list changes each week, so be sure to consult the appropriate
  list for each assignment.

  </div>

