title:      "Reading 09: Web Application"
body:       |

  **Everyone**:

  Next week, we will discuss making [web applications] using the [Python]
  standard library.  We will explore designing, implementing, and testing a
  [REST] API, which is something you will need to do for [Homework 09].

  <div class="alert info-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "book" | embed_icon }}</i> TL;DR

  The focus of this reading is to explore [web applications] and [REST] APIs in
  [Python].

  </div>

  ## Readings

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  The readings for this week are:

  1.  <div class="flex-col" markdown="1">

      [Real Python](https://realpython.org)

      -   <div class="flex-col" markdown="1">

          [How to Launch an HTTP Server in One Line of Python Code](https://realpython.com/python-http-server/)

          - [How to Start Python’s http.server in the Command Line](https://realpython.com/python-http-server/#how-to-start-pythons-httpserver-in-the-command-line)
          - [Serve Static and Dynamic Content Programmatically](https://realpython.com/python-http-server/#serve-static-and-dynamic-content-programmatically)

      -   <div class="flex-col" markdown="1">

          [Python and REST APIs: Interacting With Web Services](https://realpython.com/api-integration-in-python/)

          - [REST Architecture](https://realpython.com/api-integration-in-python/#rest-architecture)

          - [REST APIs and Web Services](https://realpython.com/api-integration-in-python/#rest-apis-and-web-services)

          - [REST and Python: Consuming APIs](https://realpython.com/api-integration-in-python/#rest-and-python-consuming-apis)

  </div>

