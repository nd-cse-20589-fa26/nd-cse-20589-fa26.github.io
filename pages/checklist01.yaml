title:      Checklist 01
body:       |

    ## Overview

    Here is a general outline of the **key** concepts and commands (*arranged by
    topic*) that you should know for **Exam 01**.

    The exam will have the following format:

    1. **Git, Shell**: Identify ways to perform certain tasks using [git] and
    in the shell (*multiple-choice*, *fill-in-the-blank*).

    2. **Files, Processes, I/O Redirection**: Identify ways to perform
    operations on files and processes, and to redirect I/O (*multiple-choice*,
    *fill-in-the-blank*).

    3. **Python Scripting**: Debug, fix, test, and evaluate a [Python] script
    (*multiple-choice*, *fill-in-the-blank*).

    4. **Data Structures**: Manipulate and utilize data structures such as
    [lists] and [dicts] in [Python] (*multiple-choice*, *fill-in-the-blank*).

    5. **Regular Expressions**: Use **regular expressions** in [Python] to
    answer some questions (*coding on the computer*).

    Parts **1** through **4** are to be done first on **paper**. Once that
    portion is completed and submitted, you will do part **5** on your own
    computer and submit code to your **assignments** repository.

    <div class="alert special-bg" markdown="1">

    **Note**: Using [requests], [csv], and [json] will not be on **Exam 01**.

    </div>

    <div class="alert warning-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "check-all" | embed_icon }}</i> Representative, But Not Exhaustive

    This checklist is meant to be representative, rather than exhaustive (ie.
    there may be questions that show up on the exam that are not shown below).

    </div>

    [git]: https://git-scm.com/
    [lists]: https://docs.python.org/3/library/stdtypes.html#list
    [dicts]: https://docs.python.org/3/library/stdtypes.html#dict
    [requests]: https://requests.readthedocs.io/
    [csv]: https://docs.python.org/3/library/csv.html
    [json]: https://docs.python.org/3/library/json.html

    ## Logistics

    **Exam 01** will take place during our normal lecture session on
    **Wednesday, September 16** from **11:30 AM - 12:20 PM** in **303 Cushing
    Hall**.

    As noted above, the first portion of the exam with be on **paper**, while
    the remaining component with require **coding** and submitting work to your
    **assignments** [GitHub] repository.

    During the **paper** portion of the exam, students will only be allowed to
    use **one cheatsheet**.  This **paper** component of the exam must be
    submitted before students can access the **coding** section.

    For the **coding** portion, students will use their own computer, and thus
    are permitted access to any material in their textbooks, notes,
    assignments, and the Internet.

    <div class="alert danger-bg"  markdown="1">

    ### <i class="icon icon-medium">{{ "alert" | embed_icon }}</i> Honor Code Violations

    Although students are allowed to use their computers and the Internet
    during the **coding** portion of the exam, students **may not communicate
    with others** or **solicit answers from others**.  **Nor may they use AI
    tools** such as **ChatGPT** or **Co-Pilot** during the exam.  Students
    caught sharing solutions or violating any portion of the honor code will
    **receive a zero on the exam**.

    Furthermore, students are not allowed to consult, copy, or share material
    from previous sections of this course.

    </div>

    [GitHub]: https://github.com

    ## Git, Shell

    ### Concepts

    * What is **Unix**?

    * What is a **shell**?

    * <div class="flex-col" markdown="1">

        How would do you use **git** to:

        - Create a copy a repository.

        - Create a new branch.

        - View the changes you've made.

        - Save a change you've made.

        - Share the changes you've made.

        - Retrieve the changes from a remote location.

    * <div class="flex-col" markdown="1">

        What are **aliases**?

        *You should know how to create one and how you would make them
        persistent (ie. survive the current shell session).*

    * <div class="flex-col" markdown="1">

        What are **environment variables**?

        *You should know how to set and modify them.  In particular, you should
        be familiar with the following **environment variables**:* `HOME` and
        `PATH`.

    [Unix]: https://en.wikipedia.org/wiki/Unix

    ### Commands

    1.  <div class="flex-col" markdown="1">

        [git](http://man7.org/linux/man-pages/man1/git.1.html)

        Version control system for managing our files.

    2.  <div class="flex-col" markdown="1">

        [pwd](https://man7.org/linux/man-pages/man1/pwd.1.html)

        Print current working directory.

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "help" | embed_icon }}</i> Sample Questions

    1. <div class="flex-col" markdown="1">

        Which environmental variable does the shell search to locate an
        executable?

        - `APPS`
        - `HOME`
        - `PATH`
        - <p>`PROGRAMS`</p>

    2. How would you create a new `checklist01` branch off an up-to-date
    `master` branch?

    </div>

    ## Files, Processes, I/O Redirection

    ### Concepts

    #### Files

    *   <div class="flex-col" markdown="1">

        What is the general layout or hierarchy of a typical Unix
        **filesystem**?

        *You should be familiar with the most common directories found in a
        typical [Unix] filesystem (e.g. `/bin`, `/etc`, `/lib`, `/usr`, `/tmp`,
        `/var`, etc.).*

    *   <div class="flex-col" markdown="1">

        What is the difference between an **absolute** and **relative** path?

        *You should know how to reference a file using both methods.*

    *   <div class="flex-col" markdown="1">

        How do Unix file **permissions** work?  How would you set them to
        restrict access for certain operations and certain classes?

        *You should be able to translate from **octal** to `rwx` triplets and
        back.*

    #### Processes

    *   <div class="flex-col" markdown="1">

        What is a **process**?  What attributes does it have?

        *You should know at a high-level the typical attributes of a process
        (ie. PID, UID, etc.).*

    *   <div class="flex-col" markdown="1">

        What does it mean to **signal** a process?  What do different the
        different signals do (`TERM`, `INT`, `KILL`)?

        *You should know the difference between terminating a process gracefully
        and terminating it forcefully.*

    *   <div class="flex-col" markdown="1">

        How do we **suspend**, **foreground**, and **background** a process?

        *You should know the appropriate keybindings and commands to perform
        these actions.*

    #### I/O Redirection

    * What three **files** does every process start with?

    * How do you redirect the output of a command into a new file?

    * How do you redirect the output of a command and append it to a file?

    * How do you redirect the output of one command as the input to another?

    * How do you direct the contents of a file into the input of command?

    * What is `/dev/null`?  How would you use it to output `stderr` but ignore
    `stdout` of a program?


    ### Commands

    1.  <div class="flex-col" markdown="1">

        [ls](http://man7.org/linux/man-pages/man1/ls.1.html)

        List the contents of a directory (long, human-readable, sorted)

    2.  <div class="flex-col" markdown="1">

        [chmod](http://man7.org/linux/man-pages/man1/chmod.1.html)

        Set permissions using **octal** and symbolic arguments.

    3.  <div class="flex-col" markdown="1">

        [stat](http://man7.org/linux/man-pages/man1/stat.1.html)

        View the inode information for a file.

    4.  <div class="flex-col" markdown="1">

        [find](http://man7.org/linux/man-pages/man1/find.1.html)

        Search directory for files by name and type.

    5.  <div class="flex-col" markdown="1">

        [ps](http://man7.org/linux/man-pages/man1/ps.1.html)

        List the processes for the current user and for the whole system.

    6.  <div class="flex-col" markdown="1">

        [kill](http://man7.org/linux/man-pages/man1/kill.1.html)

        Signal a process by PID.

    7.  <div class="flex-col" markdown="1">

        [pkill](http://man7.org/linux/man-pages/man1/kill.1.html)

        Signal a process by name.

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "help" | embed_icon }}</i> Sample Questions

    1.  <div class="flex-col" markdown="1">

        Which of the following commands makes a file executable?

        - `chmod +x file`
        - `stat file`
        - `make file`
        - `test -x file`

    2.  <div class="flex-col" markdown="1">

        Which of the following commands shows the meta-data of a file?

        - `ls -l file`
        - `stat file`
        - `du file`
        - `find file`

    3.  <div class="flex-col" markdown="1">

        Which of the following commands forcefully terminates a process?

        - `kill PID`
        - `kill -9 PID`
        - `sudo kill PID`
        - `kill -KILL PID`

    4.  <div class="flex-col" markdown="1">

        Suppose we were running `cat`.  How would we signal to the program that
        we are done inputting text?

        - `Control-Z`
        - `Control-I`
        - `Control-D`
        - `Control-C`

    5. <div class="flex-col" markdown="1">

        Which of the following pipelines counts all the "Permission denied"
        errors encountered when recursively searching file names under the
        "/etc" directory?

        - `find /etc > /dev/null | wc -l`
        - `find /etc 2>&1 > /dev/null | wc -l`
        - `find /etc 2> /dev/null | wc -l`
        - <p>`find /etc > /dev/null 2>&1 | wc -l`</p>

    6. <div class="flex-col" markdown="1">

        Which of the following appends the standard output of a program to a
        file?

        - `program > output`
        - `program 2> output`
        - `program >> output`
        - <p>`program &> output`</p>

    </div>

    <hr>

    ## Python Scripting

    ### Concepts

    1. <div class="flex-col" markdown="1">

        How do we manage control flow in [Python]? How do we utilize these
        constructs?

        - Conditionals

        - Loops

        - Exceptions

        - Functions

    2. <div class="flex-col" markdown="1">

        How do we do the following in [Python]?

        - Process command-line arguments

        - Read [standard input] (line-by-line)

        - Read input from files

        - Access environment variables

        - Change the case of a string

        - Split a string, combine a list of strings

        - Slice a list

        - Execute an external command

        - Count with dictionaries

    3. <div class="flex-col" markdown="1">

        How do we test a [Python] script?

        - Using [doctest]
        - Using [unittest]
        - Using [mypy]

    [Python]:               https://www.python.org/
    [Bourne shell]:         https://en.wikipedia.org/wiki/Bourne_shell
    [data structures]:      https://en.wikipedia.org/wiki/Data_structure
    [standard input]:       https://en.wikipedia.org/wiki/Standard_streams#Standard_input_.28stdin.29
    [regular expressions]:  https://en.wikipedia.org/wiki/Regular_expression
    [JSON]:                 http://www.json.org/
    [web scraping]:         https://en.wikipedia.org/wiki/Web_scraping
    [doctest]:              https://docs.python.org/3/library/doctest.html
    [mypy]:                 https://mypy.readthedocs.io/en/stable/
    [unittest]:             https://docs.python.org/3/library/unittest.html

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "help" | embed_icon }}</i> Sample Questions

    #### Code Snippets

    Write Python code snippets to perform the following tasks:

    1. Print out each element of a list (one element per line).

    2. Print the contents of `stdin` (line-by-line).

    3. Print the first 10 items of a list.

    4. Print the length of a list.

    5. Print the first and last words in the string "Let this promise in me
    start, Like an anthem in my heart".

    6. Print the results of the `ps aux` command.

    </div>

    ## Data Structures

    ### Concepts

    1. <div class="flex-col" markdown="1">

        What [data structures] do we have in [Python]?

        - Lists / Tuples

        - Dictionaries / Sets

    2. <div class="flex-col" markdown="1">

        What are their basic operations?

        - Create an empty data structure.

        - Add to data structure.

        - Search in data structure.

        - Remove from data structure.

        - Loop through data structure.

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "help" | embed_icon }}</i> Sample Questions

    #### Code Snippets

    Given the following data:

        :::python
        comics = {
            "marvel": ["deadpool", "spider-man", "wolverine"],
            "dc"    : ["batman", "superman"]
        }

    Write Python code snippets to perform the following tasks:

    1. Print the number of `marvel` characters.

    2. Print the last `dc` character.

    3. Print every `marvel` character in uppercase.

    4. Print all characters (from both `marvel` and `dc`).

    #### Code Evaluation

    For each of the following expressions, state the output value:

    1. `len(comics)`

    2. `list(comics.keys())[0]`

    3. `comics['marvel'][1]`

    4. `comics['dc'][-1][-3:]`

    </div>

    ## Regular Expressions

    ### Concepts

    1. What are the **three tenets** of the **Unix Philosophy**?

    2.  <div class="flex-col" markdown="1">

        What are **regular expressions**?

        You will need to know the basic **metacharacters** such as

        - `.`
        - `*`
        - `[]`
        - `[^]`
        - `^`
        - `$`
        - `()`
        - `|`
        - `\n`
        - <p>`{m, n}`</p>

    ### Commands

    1.  <div class="flex-col" markdown="1">

        [cut](http://man7.org/linux/man-pages/man1/cut.1.html)

        Extract fields or characters.

    2.  <div class="flex-col" markdown="1">

        [wc](http://man7.org/linux/man-pages/man1/wc.1.html)

        Display number of words, lines, or bytes.

    3.  <div class="flex-col" markdown="1">

        [grep](http://man7.org/linux/man-pages/man1/grep.1.html)

        Search based on pattern.

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "help" | embed_icon }}</i> Sample Questions

    Given the file `tmnt.txt`, which contains:

        :::text
        Leonardo      blue    katana
        Donatello     purple  bo
        Raphael       red     sai
        Michelangelo  orange  nunchucks

    Given the `tmnt.txt` file above, write [Python] code that performs the
    following tasks:

    - List only the names of the turtles.

    - List only the colors of the turtles.

    - List only the weapons of the turtles.

    - List only the turtles whose names end in `lo`.

    - List only the turtles with last names that contain two consecutive vowels.

    - Count how many colors begin with a `b`.

    - Count how many colors end with an `e`.

    - List only the turtles names whose name ends with a vowel and whose weapon
      ends with a vowel.

    - List only the turtles names with two of the same consecutive letter (i.e.
      `aa`, `bb`, etc.)

    - List the colors that don't end with a vowel.

    - List the weapons that contains a repeat letter anywhere in the string.
    </div>
