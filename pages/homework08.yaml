title:      "Homework 08: Curlit"
body:       |

  The goal of this homework assignment is to allow you to practice using
  [system calls] involving [networking] with [sockets] in [Python] by implementing
  a simplified version of [curl] named `curlit`.

  For this assignment, record your source code and any responses to the
  following activities in the `homework08` folder of your **assignments**
  [GitHub] repository and push your work by **noon Saturday, November 7**.

  [networking]: https://en.wikipedia.org/wiki/Computer_network
  [sockets]: https://en.wikipedia.org/wiki/Network_socket
  [HTTP]: https://en.wikipedia.org/wiki/Hypertext_Transfer_Protocol
  [curl]: https://curl.se/
  [Python]: https://python.org
  [system calls]: https://en.wikipedia.org/wiki/System_call

  ## Activity 0: Preparation

  Before starting this homework assignment, you should first perform a `git
  pull` to retrieve any changes in your remote [GitHub] repository:

      :::bash
      $ cd path/to/repository                   # Go to assignments repository

      $ git switch master                       # Make sure we are in master branch

      $ git pull --rebase                       # Get any remote changes not present locally

  Next, create a new branch for this assignment:

      :::bash
      $ git switch -c homework08                # Create homework08 branch and check it out

  ### Task 1: Skeleton Code

  To help you get started, the instructor has provided you with the following
  **skeleton code**:

      :::bash
      # Create homework08 folder
      $ mkdir homework08

      # Go to homework08 folder
      $ cd homework08

      # Download Makefile
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20589.fa26/static/txt/homework08/Makefile

      # Download Python skeleton code
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20589.fa26/static/txt/homework08/curlit.py

  Once downloaded, you should see the following files in your `homework08`
  directory:

      :::bash
      homework08
          \_ Makefile           # This is the Makefile for building all the assignment artifacts
          \_ curlit.py          # This is the Python script for the curlit script

  <div class="alert warning-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "alert" | embed_icon }}</i> DocTests

  You may notice that in addition to the usual comments and `TODOs`, the
  [docstrings] of each method also contains a few [doctests].

  You are **not** to modify these [doctests] and must keep them in-place. They
  are used to verify the correctness of your code.

  Your code goes **below** the [docstrings], where the `TODO` and `pass`
