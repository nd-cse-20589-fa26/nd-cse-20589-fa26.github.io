title:      "Reading 08: Networking"
body:       |

  **Everyone**:

  Next week, we will discuss [system calls] involving [networking].  We will
  explore using [sockets] to communicate between [clients] and [servers] and
  eventually create our own [HTTP] client in [Homework 08].

  <div class="alert info-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "book" | embed_icon }}</i> TL;DR

  The focus of this reading is to explore [system calls] related to network
  [sockets] in [Python].

  </div>

  ## Readings

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  The readings for this week are:

  1.  <div class="flex-col" markdown="1">

      [Real Python](https://realpython.org)

      - [Socket Programming in Python (Guide)](https://realpython.com/python-sockets/)

      *Just focus on the sections up through [Communication Breakdown](https://realpython.com/python-sockets/#communication-breakdown)*.

  2.  <div class="flex-col" markdown="1">

      [Mozilla Developer Network](https://developer.mozilla.org)

      - [How the web works](https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Web_standards/How_the_web_works)
      - [What is a URL?](https://developer.mozilla.org/en-US/docs/Learn/Common_questions/What_is_a_URL)

  </div>

  <div class="flex-col-25">

