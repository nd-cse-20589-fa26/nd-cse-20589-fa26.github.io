title:  "Notes 00: Syllabus"
body:   |

  ## Ice Breaker
  
  ### What have you heard about this class?

  - **Hard** b/c **Noobs** -> **Unfamiliar** (Gielinor), but if you **stick with
  it**, **persist** with the **grind**, you will get **better**

  <div class="centered" markdown="1">

  **Journey** where you will **grow** and **improve**.

  </div>

  ## Whoami?

  - **Triple Domer**, **Children**
  - I will be the **villain / antagonist** (*Thanos, balanced*)
  - **Avengers** are the **TAs** (*introduce them*)

  <div class="centered" markdown="1">

  I **demand a lot**, but I want you to **succeed**, and I will provide
  **resources** and **support** to learn.

  </div>

  ## Motivation

  In order to take **advantage** of tools such as **AI**, we need to understand
  how to **use** software systems, how to **build** them, and how they
  **work**.
  
  <div class="centered" markdown="1">

  The goal is to not be **muggles**, but learn how to be **wizards**.

  </div>

  ## Syllabus

  - Explain why we have **Readings** (*need regular practice*)

  - This is not **Physics** or **English**, this is not about **cram and
  forget** (*building foundational skills and knowledge*)

  - **Honor Code**: encouraged to **work together** and teach each other but
  **sharing solutions is not helping**; use **AI** as if they were a **TA**

  - **Analogy**: Athlete, Band Member: **Practice**, **Practice**, **Practice**
