  ## Review: <span class="gold">TCP/IP</span>

  <div class="centered">

  <img src="static/img/slides24-tcpip.svg" class="transparent responsive">

  </div>

  1. To communicate over the <strong class="primary">network</strong>, <strong
  class="info">client</strong> makes request to <strong
  class="danger">server</strong>.

  2. <strong class="info">Client</strong> needs to know <strong
  class="caution">IP address</strong> and <strong class="warning">port</strong>
  of <strong class="danger">Server</strong> (*review*).

  3. <strong class="special">Packets</strong> are sent between <strong
  class="info">client</strong> and <strong class="danger">server</strong>, but
  may be **lost** (*package analogy*).

  4. <strong class="success">TCP</strong> is used to provide <strong
  class="success">streaming abstraction</strong> with **delivery control**.

  ## Review: <span class="gold">URL</span>

  <div class="centered">

  <img src="static/img/slides24-url.svg" class="transparent responsive">

  </div>

  1. <strong class="primary">Web browser</strong> is the most common <strong
  class="info">client</strong> (<strong class="special">HTTP</strong>).

  2. Use a <strong class="success">URL</strong> to denote what **resource** we
  are requesting.

  3. <strong class="special">Protocol</strong> defines rules for communication.

  4. <strong class="info">Host</strong> indicates the <strong
  class="danger">server</strong> we want to contact.

  5. <strong class="warning">Port</strong> specifies the <strong
  class="warning">service</strong> number we want to utilize.

  6. <strong class="success">Path</strong> tells server what **resource** we
  want.

  7. <strong class="danger">Query String</strong> are arguments (**example**:
    google.com, query string).

  ## Sockets: [echo_client] / [echo_server]

