title:  "Extra Credit 01"
body:   |

    For up to **1.0** points of extra credit, you may do both of the following
    **Extra Credit** opportunities by **Monday, September 28**:

    ## Extra Credit 01-A: <span class="gold">Exam Corrections</span> (<i class="muted">0.5 Points</i>)

    Correct **10%** (ie. **4 Points**) of **Exam 01** and then meet with a
    **teaching assistant** during their office hours to explain the corrections
    you made.

    If you cannot figure out the correct solutions, then you can alternatively
    go to their office hours with **specific written questions** and discuss
    the solutions.

    <div class="alert warning-bg" markdown="1">

    This meeting should be no more than `10`-`15` minutes.

    </div>

    ## Extra Credit 01-B: <span class="gold">Shell Customizations</span> (<i class="muted">0.5 Points</i>)

    Customize your terminal or shell and then post a **screenshot** of your
    customization in action along with the relevant prompt (ie. `$PS1`) in the
    following [Extra Credit 01-B] Google Document:

    <div class="centered">
      <a href="https://docs.google.com/document/d/16AGDmiVRwltCqXUJNuNXnVdCVAFIigTGwCCdS5XDNKM/edit?usp=sharing" class="badge warning-btn" target="_new" style="font-size: 150%;">Extra Credit 01-B</a>
    </div>

    [Extra Credit 01-B]: https://docs.google.com/document/d/16AGDmiVRwltCqXUJNuNXnVdCVAFIigTGwCCdS5XDNKM/edit?usp=sharing

    <div class="alert success-bg" markdown="1">

    For a starting point, checkout [Homework 01 - Just For Fun (Optional)](https://pnutz.h4x0r.space/courses/cse.20589.fa26/homework01.html#just-for-fun-optional).

    </div>
