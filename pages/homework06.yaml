  ## Activity 2: timeit (*0.8 Points*)

  For this activity, write a [Python] script, `timeit.py`, that executes the
  given command until a timeout is reached or the program terminates as shown
  below:

  <div class="framed centered">
  <script src="https://asciinema.org/a/KLe593FTSHX0QupA.js" id="asciicast-KLe593FTSHX0QupA" async="true"></script>
  </div>

  The `timeit.py` script takes the following possible flags:

  - `-d`: This allows the user to specify the amount of time to sleep between
  iterations (default is `0.1` seconds).

  - `-t`: This allows the user to specify the amount of time to wait before
    killing the process (default is `1` second).

  After the flags, the user must provide a `command` and its arguments to run.

  <div class="alert warning-bg" markdown="1">

  **Note**: If the time limit is exceeded, the parent should [kill] the child
  and [wait] for it.  Moreover, the parent should always return the **child's
  exit status** as its own **exit status**.

  If the child was [kill]ed, then the parent should return the [signal] it was
  terminated with.

  </div>

  [kill]: https://docs.python.org/3/library/os.html#os.kill
  [wait]: https://docs.python.org/3/library/os.html#os.wait

  ### Task 1: `timeit.py`

  To build this script, you will need to complete the `timeit.py` [Python]
  script by implementing the following **methods** in the `Timer` **class**:

  <div class="centered">

  <img src="static/img/homework06-timeit.svg" class="transparent responsive">

  </div>

  #### Context Manager Protocol

  The core of the program is the **context manager protocol**, which will be in
  charge of managing the child **process**.

  -   <div class="flex-col" markdown="1">

      `__enter__(self):`

      > When this **method** is called, the parent **process** will call
      > [os.fork] to create a child **process**.

      - **Child**: The child will call [os.execvp] to execute the `command`
      given to the `Timer` object and if it fails, it will call [sys.exit] with
      an error **exit status**.

      - **Parent**: The parent will register [signal] handlers for `SIGALRM`
      and `SIGCHLD` before setting a [signal.alarm] for the `timeout` given to
      the `Timer` object.

  -   <div class="flex-col" markdown="1">

      `__exit__(self, exc_type, exc_val, exc_tb):`

      > When this **method** is called, the parent **process** will cancel the
      [signal.alarm] and then [wait] for the child **process** by calling the
      `handle_sigchld` handler manually.

  [os.fork]: https://docs.python.org/3/library/os.html#os.fork
  [os.execvp]: https://docs.python.org/3/library/os.html#os.execvp
  [sys.exit]: https://docs.python.org/3/library/sys.html#sys.exit
  [signal.alarm]: https://docs.python.org/3/library/signal.html#signal.alarm

  #### Signal Handlers

  The [signal] handlers are responsible for handling the `SIGALRM` and
  `SIGCHLD` events respectively:

  -   <div class="flex-col" markdown="1">

      `handle_sigalrm(signum, frame):`

      > This should attempt to terminate the child **process** by sending it a
      `SIGTERM` (*graceful*) and then a `SIGKILL` (*forceful*) [signal].

  -   <div class="flex-col" markdown="1">

      `handle_sigchld(signum, frame):`

      > This should attempt to wait for the child **process** and update the
      `status` of the `Timer` object if the `status` is still `None`.

  #### Iterator Protocol

  The **iterator protocol** allows the user to loop over the `Timer` object and
  get the **elapsed time**.

  -   <div class="flex-col" markdown="1">

      `__iter__(self):`

      > This returns the current instance of the `Timer` object.

  -   <div class="flex-col" markdown="1">

      `__next__(self):`

      > If the `status` of the `Timer` object is `None`, then `StopIteration`
      is **raised**.  Otherwise, this method [sleeps] for `timedelta` and
      updates the overall `elapsed` time by `timedelta`.  If this new `elapsed`
      time exceeds the `timeout` then `StopIteration` is **raised**.
      Otherwise, the new overall `elapsed` time is returned.

  [sleeps]: https://docs.python.org/3/library/time.html#time.sleep

  #### Properties

  There are two **properties** in the `Timer` class that translate the `status`
  of the child **process** into something more understandable:

  -   <div class="flex-col" markdown="1">

      `state(self)`

      > This returns a **string** representing the **state** of the child **process**.

      - If child **process** is still running, then return [next] `spinner` string.

      - Otherwise, if child **process** is terminated, then return `Success`
      `Failure`, `Terminated`, `Killed` based on **exit status**.

      <div class="alert success-bg" markdown="1">

      To determine if the child **process** exited normally, you can use the [os.WIFEXITED] function:

          :::python
          if os.WIFEXITED(status):            # Exited normally
              status = os.WEXITSTATUS(status)
          else:                               # Terminated by signal
              status = os.WTERMSIG(status)

      </div>

  -   <div class="flex-col" markdown="1">

      `returncode(self)`

      > This returns an **integer** corresponding to the **exit status** of the
      child **process**.

      As noted above, you will need to extract the final `returncode` from the
      `status` attribute using either [os.WEXITSTATUS] or [os.WTERMSIG],
      depending on whether or not the child **process** terminated normally or
      not.

  [next]: https://docs.python.org/3/builtins/functions.html#next
  [os.WIFEXITED]: https://docs.python.org/3/library/os.html#os.WIFEXITED
  [os.WEXITSTATUS]: https://docs.python.org/3/library/os.html#os.WEXITSTATUS
  [os.WTERMSIG]: https://docs.python.org/3/library/os.html#os.WTERMSIG

  #### Main Execution

  Finally, you will need to **parse the command line options** and use the
  `Timer` **class** to implement the `timeit.py` utility.

  -   <div class="flex-col" markdown="1">

      `main(arguments: list[str]=sys.argv[1:]) -> None`

      > This executes given `command` for specified `timeout` and shows the
      `Timer`'s status every `timedelta` seconds.

      <div class="alert success-bg" markdown="1">

      For consistent output, you should use the following when printing out the
      `Timer`'s elapsed time:

          :::python
          sys.stdout.write('Elapsed time: {elapsed:0.2f} / {timeout:0.2f} ({timer.state})\r')
          sys.stdout.flush()

      The `\r` at the end allows the for the output to overwrite the existing
      line and the `sys.stdout.flush` ensures the line is sent to the terminal.

      For the final status output (ie. after the `with`), you should replace
      the `\r` with a `\n`.

      </div>

  ### Task 2: Testing

  As you implement `timeit.py`, you can use the provided [doctests] to verify the
  correctness of your code:

      :::bash
      # Run doctests
      $ python3 -m doctest timeit.py -v
      ...
      8 items passed all tests:
        3 tests in timeit.Timer.__enter__
        3 tests in timeit.Timer.__exit__
        2 tests in timeit.Timer.__iter__
        1 test in timeit.Timer.__next__
        2 tests in timeit.Timer.handle_sigalrm
        2 tests in timeit.Timer.handle_sigchld
        1 test in timeit.Timer.returncode
        1 test in timeit.Timer.state
      15 tests in 15 items.
      15 passed.
      Test passed.

  You can also use `make` to run both the [doctests] and the [unit tests]:

      :::bash
      # Run unit tests (and doctests)
      $ make test-timeit
      Testing timeit ...
      test_00_doctest (__main__.TimeitTest.test_00_doctest) ... ok
      test_01_mypy (__main__.TimeitTest.test_01_mypy) ... ok
      test_02_usage (__main__.TimeitTest.test_02_usage) ... ok
      test_03_false (__main__.TimeitTest.test_03_false) ... ok
      test_04_true (__main__.TimeitTest.test_04_true) ... ok
      test_05_sleep_1 (__main__.TimeitTest.test_05_sleep_1) ... ok
      test_06_sleep_5 (__main__.TimeitTest.test_06_sleep_5) ... ok
      test_07_troll (__main__.TimeitTest.test_07_troll) ... ok

         Score 10.00 / 10.00
         Grade  1.00 /  1.00
        Status Success

      ----------------------------------------------------------------------
      Ran 8 tests in 6.611s

      OK

  To just run the [unit tests], you can do the following:

      :::bash
      # Run unit tests
      $ ./timeit.test -v
      ...

  To run a specific [unit test], you can specify the **method name**:

      :::bash
      # Run only mypy unit test
      $ ./timeit.test -v timeitTest.test_01_mypy
      ...

  To manually check your types, you can use [mypy]:

      :::bash
      # Run mypy to check types
      $ mypy timeit.py

