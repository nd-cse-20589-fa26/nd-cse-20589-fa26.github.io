title:      "Homework 06: Timeit"
body:       |

  The goal of this homework assignment is to allow you to practice using
  [object-oriented programming] and [system calls] involving [processes] and [signals]
  in [Python] by implementing one new [Unix] utility:

  > The `timeit` utility allows users to view the elapsed time of an
  application while also enforcing a timeout (*or cut off time*).

  <div class="alert danger-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "bomb" | embed_icon }}</i> Set us up the bomb (No!)

  Be careful with the [fork] system call.  To prevent a [fork bomb], make sure
  you are not doing it in a **loop**.

  If you still manage to create a [fork bomb], **do not** simply go to another
  machine and run the same program.  Notify the
  [csehelp@nd.edu](mailto:csehelp@nd.edu) and explain what happened.

  </div>

  For this assignment, record your scripts and any responses to the following
  activities in the `homework06` folder of your **assignments** [GitHub]
  repository and push your work by **noon Saturday, October 10**.

  [Python]: https://www.python.org/
  [object-oriented programming]: https://en.wikipedia.org/wiki/Object-oriented_programming
  [system calls]: https://en.wikipedia.org/wiki/System_call
  [processes]: https://en.wikipedia.org/wiki/Process_(computing)
  [signal]: https://en.wikipedia.org/wiki/Signal_(IPC)
  [signals]: https://en.wikipedia.org/wiki/Signal_(IPC)
  [Unix]: https://en.wikipedia.org/wiki/Unix
  [fork]: https://docs.python.org/3/library/os.html#os.fork
  [fork bomb]: https://en.wikipedia.org/wiki/Fork_bomb

  ## Activity 0: Preparation

  Before starting this homework assignment, you should first perform a `git
  pull` to retrieve any changes in your remote [GitHub] repository:

      :::bash
      $ cd path/to/repository                   # Go to assignments repository

      $ git switch master                       # Make sure we are in master branch

      $ git pull --rebase                       # Get any remote changes not present locally

  Next, create a new branch for this assignment:

      :::bash
      $ git switch -c homework06                # Create homework06 branch and check it out

  ### Task 1: Skeleton Code

  To help you get started, the instructor has provided you with the following **skeleton code**:

      ::bash
      # Go to homework06 folder
      $ cd homework06

      # Download Makefile
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20589.fa26/static/txt/homework06/Makefile

      # Download Python skeleton code
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20589.fa26/static/txt/homework06/timeit.py

  Once downloaded, you should see the following files in your `homework06` directory:

      :::bash
      homework06
          \_ Makefile       # This is the Makefile building all the assignment artifacts
          \_ timeit.py      # This is the Python script for the timeit script

