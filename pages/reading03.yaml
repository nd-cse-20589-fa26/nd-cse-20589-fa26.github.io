title:      "Reading 03: Regular Expressions, CSV, JSON"
body:       |

  **Everyone**:

  Next week, we will continue exploring scripting in [Python] by using the
  programming language to process data in a variety of formats.  In particular,
  we will examine using [regular expressions] on plain text, discuss using data
  in [CSV] and [JSON], and then take a brief look at [HTML] and [XML].

  <div class="alert info-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "book" | embed_icon }}</i> TL;DR

  The focus of this reading is to introduce processing data in [Python] using
  [regular expressions] and libraries for [CSV] and [JSON] formats.

  </div>

  [regular expressions]: https://en.wikipedia.org/wiki/Regular_expression
  [CSV]: https://en.wikipedia.org/wiki/Comma-separated_values
  [JSON]: https://en.wikipedia.org/wiki/JSON
  [HTML]: https://en.wikipedia.org/wiki/HTML
  [XML]: https://en.wikipedia.org/wiki/XML

