title:      "Reading 10: Databases"
body:       |

  **Everyone**:

  Next week, we will discuss using [databases] in our [web applications] with
  the [sqlite] library in [Python].  We will explore creating, inserting, and
  selecting data using [SQL], which will be necessary for [Homework 10].

  <div class="alert info-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "book" | embed_icon }}</i> TL;DR

  The focus of this reading is to explore [databases], [sqlite], and [SQL] in
  [Python].

  </div>

  [databases]: https://en.wikipedia.org/wiki/Database
  [sqlite]: https://www.sqlite.org/
  [SQL]: https://en.wikipedia.org/wiki/SQL
  [Homework 10]: homework10.html

  ## Readings

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  The readings for this week are:

  1.  <div class="flex-col" markdown="1">

      [Real Python](https://realpython.org)

      -   <div class="flex-col" markdown="1">

          [Data Management With Python, SQLite, and SQLAlchemy](https://realpython.com/python-sqlite-sqlalchemy/)

          - [Using Flat Files for Data Storage](https://realpython.com/python-sqlite-sqlalchemy/#using-flat-files-for-data-storage)

          - [Using SQLite to Persist Data](https://realpython.com/python-sqlite-sqlalchemy/#using-sqlite-to-persist-data)

          - [Structuring a Database With SQL](https://realpython.com/python-sqlite-sqlalchemy/#structuring-a-database-with-sql)

      -   <div class="flex-col" markdown="1">

          [Introduction to Python SQL Libraries](https://realpython.com/python-sql-libraries/)

          <i>Only focus on the [SQLite] sections of the tutorial.</i>

  </div>

