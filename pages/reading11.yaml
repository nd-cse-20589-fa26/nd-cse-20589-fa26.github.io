title:      "Reading 11: HTML, CSS"
body:       |

  **Everyone**:

  Next week, we will discuss creating a [front-end] to our [web applications]
  with [HTML] and [CSS], which will be necessary for [Homework 10].

  <div class="alert info-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "book" | embed_icon }}</i> TL;DR

  The focus of this reading is to explore [HTML] and [CSS].

  </div>

