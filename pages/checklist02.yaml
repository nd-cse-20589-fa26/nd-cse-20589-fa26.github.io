    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "help" | embed_icon }}</i> Sample Questions

    1.  <div class="flex-col" markdown="1">

        Given the following **text** in `data.txt`:

            Leonardo:blue:katana
            Donatello:purple:bo
            Raphael:red:sai
            Michelangelo:orange:nunchucks

        Write a **pipeline** to extract just the **colors**.

    2.  <div class="flex-col" markdown="1">

        Given the following **Python** code:

            :::python
            for line in sorted(set(sys.stdin)):
                print(line)

        Write a **pipeline** that accomplishes the same task.

    </div>

    ## Python

    ### Sorting

    #### Concepts

    1.  <div class="flex-col" markdown="1">

        How do we **sort** sequences in **Python**?

        - In-place?
        - In **ascending** vs **descending** order?
        - With a custom `key` function?
        - With multiple factors?

    2.  <div class="flex-col" markdown="1">

        How do we **fetch** data using **HTTP** in **Python**?

        - Extract **text** contents.
        - Extract **JSON** contents.

    #### Functions

    <table class="bordered">
    <thead>
      <th>Function</th>
      <th>Description</th>
    </thead>
    <tbody>
      <tr class="info-bg">
        <td class="centered"><code>sorted(seq)</code></td>
        <td>Order sequence.</td>
      </tr>
      <tr class="success-bg">
        <td class="centered"><code>requests.get(url)</code></td>
        <td>Fetch data using HTTP.</td>
      </tr>
    </tbody>
    </table>

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "help" | embed_icon }}</i> Sample Questions

    1. Fetch the [Catalog JSON Data], sort it by **type** (*highest priority*),
    **name**, and **owner** (*lowest priority*), and display the results.

    2. Using the same [Catalog JSON Data], sort the services by **version
    number** in **descending order** and display the results.

    </div>

    [Catalog JSON Data]: https://catalog.cse.nd.edu/query.json

    ### Functional Programming

    #### Concepts

    1.  <div class="flex-col" markdown="1">

        What is the difference between **imperative** and **functional programming**?

        - What are some benefits of **functional programming**?

        - How is **functional programming** related to the **Unix Philosophy**?

    2. How do we use `map`, `filter`, and `lambda` to do **functional
    programming** in **Python**?

    3. How do we use **list comprehensions** in **Python**?

    4. What is an **iterator** and how is it different from a **list**?

    5.  <div class="flex-col" markdown="1">

        What is a **generator** and how it is different from a **list**?

        - What does the `yield` command do?

        - Why would we use a **generator** over a **list** (*and vice versa*)?

        - How do we convert a **list comprehension** to a **generator expression**?

    6. How do we implement the **iterator protocol**?

    #### Functions

    <table class="bordered">
    <thead>
      <th>Function</th>
      <th>Description</th>
    </thead>
    <tbody>
      <tr class="info-bg">
        <td class="centered"><code>map(func, seq)</code></td>
        <td>Apply function to each element in sequence.</td>
      </tr>
      <tr class="success-bg">
        <td class="centered"><code>filter(func, seq)</code></td>
        <td>Apply function to each element in sequence and keep ones that return True.</td>
      </tr>
      <tr class="info-bg">
        <td class="centered"><code>iter(iterable)</code></td>
        <td>Gets iterator from iterable object.</td>
      </tr>
      <tr class="info-bg">
        <td class="centered"><code>next(iterator)</code></td>
        <td>Gets next element from iterator.</td>
      </tr>
    </tbody>
    </table>

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "help" | embed_icon }}</i> Sample Questions

    Translate the following **imperative** code:

        :::python
        def find_squares(start, end):
            squares = []
            for number in range(start, end):
                if math.sqrt(number) == int(math.sqrt(number)):
                    squares.append(number)
            return squares

    1. To using `map`, `filter`, and `lambda`.
    2. To using a **list comprehension**.
    3. To using a **generator** with `yield`.
    4. To using a **generator expression**.
    5. To using an **object** that implements the **iterator protocol**.

    </div>

    ### Object-oriented Programming

    1.  <div class="flex-col" markdown="1">

        What are the **four principles** of the **Object-oriented Programming**?

          - How do we create a `class` with a **constructor**?
          - How do we create a `dataclass`?
          - How do we define **attributes**?
          - How do we define **methods**?
          - How do we define **properties**?
          - How do we define **dunder methods**?

    2.  How do we implement the **context manger protocol**?

    3.  <div class="flex-col" markdown="1">

        What is a **process**?

        - What attributes or components does it have?

        - What **system calls** can you do with them?

    4.  <div class="flex-col" markdown="1">

        What happens during the life cycle of a typical **process**?

        - After a `fork`, how does a **process** determine if they are the **child** or **parent**?

        - What happens when a **process** performs `exec`?

        - Why is it good practice to perform a `wait`?

        - What is the purpose of `exit`?

    5.  <div class="flex-col" markdown="1">

        How do we avoid a **fork bomb**?

        - How do we reap **zombies**?

        - Why would we want to prevent these situations?

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "help" | embed_icon }}</i> Sample Questions

    1.  <div class="flex-col" markdown="1">

        Given the following **Python** code:

            :::python
            def curl_all(urls: list[str]):
                ''' Perform curl on each url and print text contents concurrently. '''
                for url in urls:
                    command = ['curl', '-sL', url]
                    if (pid := os.fork()) == 0:
                        os.execvp(command[0], command)

            curl_all(sys.argv[1:])

        Which of the following statements are true (*choose all that apply*)?

        - `os.fork` will always succeed.
        - `os.execvp` will always succeed.
        - This program could behave like a **fork bomb**.
        - This program will create **orphans**.
        - This program will create **zombies**.

    2.  <div class="flex-col" markdown="1">

        Re-write the `curl_all` function using
        `concurrent.futures.ProcessPoolExecutor` and `requests` rather than
        `os.fork` and `curl` to accomplish the same task.

    </div>

    ### Translations

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "help" | embed_icon }}</i> Sample Questions

    Given the following **pipelines**, write **Python** code that accomplishes
    the same task.

    <div class="alert danger-bg" markdown="1">

    **Note**: *No credit will be given for simply calling `os.system` on the
    given **pipeline**. You may use `os.popen` to read the output of the
    **first command**, but you may not use a pipeline*.

    </div>

    1. `cat /etc/passwd | cut -d : -f 1 | grep d$ | wc -l`

    2. `cat /etc/passwd | cut -d : -f 3 | grep -E '^[0-9]{2}$' | sort | uniq`

    3. `curl -sL http://yld.me/raw/lmz | cut -d , -f 1 | grep -Eo '^[^jfs].*'`

    4. `curl -sL http://yld.me/raw/lmz | cut -d , -f 2 | grep -Eo '^B.*' | sort`

    5. `who | sed -rn 's|.*\((.*)\).*|\1|p' | sort | uniq`

    6. `ls -l /etc | awk '{print $2}' | sort | uniq -c`

    </div>
