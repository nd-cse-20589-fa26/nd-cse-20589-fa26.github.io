    ## Logistics

    **Exam 02** will take place during our normal lecture session on
    **Wednesday, October 14** from **11:30 AM - 12:20 PM** in **303 Cushing
    Hall**.

    As noted above, the first portion of the exam with be on **paper**, while
    the remaining component with require **coding** and submitting work to your
    **assignments** [GitHub] repository.

    During the **paper** portion of the exam, students will only be allowed to
    use **one cheatsheet**.  This **paper** component of the exam must be
    submitted before students can access the **coding** section.

    For the **coding** portion, students will use their own computer, and thus
    are permitted access to any material in their textbooks, notes,
    assignments, and the Internet.

    <div class="alert danger-bg"  markdown="1">

    ### <i class="icon icon-medium">{{ "alert" | embed_icon }}</i> Honor Code Violations

    Although students are allowed to use their computers and the Internet
    during the **coding** portion of the exam, students **may not communicate
    with others** or **solicit answers from others**.  **Nor may they use AI
    tools** such as **ChatGPT** or **Co-Pilot** during the exam.  Students
    caught sharing solutions or violating any portion of the honor code will
    **receive a zero on the exam**.

    Furthermore, students are not allowed to consult, copy, or share material
    from previous sections of this course.

    </div>

    [GitHub]: https://github.com

    ## Shell

    ### Networking

    #### Concepts

    -   <div class="flex-col" markdown="1">

        What is an **IP address**? How is a **domain name** related to it?

        *You should know the commands to lookup this information.*

    -   <div class="flex-col" markdown="1">

        What is a network **port**?

        *You should know how to scan for ports and how to connect to a machine
        at a specific a domain or address and port number.*

    -   <div class="flex-col" markdown="1">

        What is **bandwidth** and **latency**?

        *You should know what each measures and what programs we would use to
        perform these measurements.*

    #### Commands

    <table class="bordered">
    <thead>
      <th>Command</th>
      <th>Description</th>
    </thead>
    <tbody>
      <tr class="info-bg">
        <td class="centered"><b>ip</b></td>
        <td>List the IP addresses of the current machine.</td>
      </tr>
      <tr class="success-bg">
        <td class="centered"><b>host</b></td>
        <td>Lookup IP addresses corresponding to domain.</td>
      </tr>
      <tr class="info-bg">
        <td class="centered"><b>nmap</b></td>
        <td>Scan remote machine for open ports.</td>
      </tr>
      <tr class="success-bg">
        <td class="centered"><b>nc</b></td>
        <td>General purpose tool to communicate with network services.</td>
      </tr>
      <tr class="info-bg">
        <td class="centered"><b>curl</b></td>
        <td>Perform a HTTP request.</td>
      </tr>
      <tr class="success-bg">
        <td class="centered"><b>ping</b></td>
        <td>Measure delay from host to remote machine.</td>
      </tr>
    </tbody>
    </table>

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "help" | embed_icon }}</i> Sample Questions

    1.  <div class="flex-col" markdown="1">

        Which of the following **commands** can be used to measure
        **bandwidth**?

        - `host URL`
        - `ping URL`
        - `nmap URL`
        - `curl URL`

    2.  <div class="flex-col" markdown="1">

        Run the `ip addr` command on a **student machine**.

        - What is the **localhost** **IP address**?
        - What is the **private** **IP address** (*if any*)?
        - What is the **public** **IP address** (*if any*)?

    </div>

    ### Filters and Pipelines

    #### Concepts

    1.  <div class="flex-col" markdown="1">

        What are the **three tenets** of the **Unix Philosophy**?

        *You should be familiar with these tenets and what following them
        enables when building or using software systems*.

    2.  <div class="flex-col" markdown="1">

        What are **filters**?

        *You should be familiar with the general idea of a filter and know how
        to use specific tools for certain tasks.*

    3.  <div class="flex-col" markdown="1">

        What are **pipelines**?

        *You should be comfortable with combining filters and other commands
        into pipelines to solve problems.*

    #### Commands

    <table class="bordered">
    <thead>
      <th>Command</th>
      <th>Description</th>
    </thead>
    <tbody>
      <tr class="info-bg">
