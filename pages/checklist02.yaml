title:      Checklist 02
body:       |

    ## Overview

    Here is a general outline of the **key concepts** (*arranged by topic*)
    that you should know for **Exam 02**.

    The exam will have the following format:

    1. **Shell**: Identify ways to perform certain tasks using **networking**
    commands, **filters**, or **pipelines** (*multiple-choice*,
    *fill-in-the-blank*).

    2. **Python - Sorting**: Debug, fix, test, and evaluate a **Python** script
    that involves **sorting** data in **JSON** format.  (*multiple-choice*,
    *fill-in-the-blank*).

    3. **Python - Functional Programming**: Debug, fix, test, and evaluate a
    **Python** script that involves the **functional programming**,
    **iterators**, **generators**, and the **iterator protocol**.
    (*multiple-choice*, *fill-in-the-blank*).

    4. **Python - Object-Oriented Programming**: Debug, fix, test, and evaluate
    a **Python** script that involves **object-oriented programming**,
    **processes**, and the **context manager protocol**.  (*multiple-choice*,
    *fill-in-the-blank*).

    5. **Python - Translations**: Convert **pipelines** to **Python** code
    (*coding on the computer*).

    Parts `1` through `4` are to be done first on **paper**. Once that portion
    is completed and submitted, you will do part `5` on your own computer and
    submit code to your **assignments** repository.

    <div class="alert special-bg" markdown="1">

    **Note**: Using **signals** will not be on **Exam 02**.

    </div>

    <div class="alert warning-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "check-all" | embed_icon }}</i> Representative, But Not Exhaustive

    This checklist is meant to be representative, rather than exhaustive (ie.
    there may be questions that show up on the exam that are not shown below).

    </div>

