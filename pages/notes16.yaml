title:  "Notes 16: Concurrency and Parallelism"
body:   |

  ## Review: <span class="gold">Iterators, Generators</span>

  1.  <div class="flex-col" markdown="1">

      To implement the <strong class="warning">iterator protocol</strong>, an
      **object** must implement which **methods**?

      > `__iter__()` and `__next__()`

  2.  <div class="flex-col" markdown="1">

      To implement a <strong class="success">generator</strong>, a **function**
      must use which **keyword**?

      > `yield`

  ```python
  #!/usr/bin/env python3

  from typing import Iterable, Iterator

  # Constants

  CHUNKS = [(1, 2, 3), (4, 5, 6), (7, 8, 9)]

  # Iterator

  class Flatten:

      def __init__(self, sequence: Iterable[Iterable[int]]):
          self.sequence = sequence

      def __iter__(self):
          # Create iterator for all subsequences, and get first one
          self.all_iterators    = map(iter, self.sequence)
          self.current_iterator = next(self.all_iterators)
          return self

      def __next__(self):
          # Attempt to get element from current iterator
          # - Go to next iterator if current one is exhausted
          # - If all iterators are exhausted, then StopIteration will be raised

          element = None

          while element is None:
              try:
                  element = next(self.current_iterator)
              except StopIteration:
                  self.current_iterator = next(self.all_iterators)

          return element

  # Generator

  def flatten(sequence: Iterable[Iterable[int]]) -> Iterator[int]:
      ''' Version 0 '''
      for subsequence in sequence:
          for element in subsequence:
              yield element

      ''' Version 1 '''
      for subsequence in sequence:
          yield from subsequence

  # Main Execution

  for number in CHUNKS:
      print(number)

  print()

  for number in Flatten(CHUNKS):
      print(number)

  print()

  for number in flatten(CHUNKS):
      print(number)

  print()
  ```

  ## Generators: <span class="gold">Trade-Offs</gold>

  Using the following to benchmark `odds.py` from [Reading 05]:

  ```bash
  $ seq 10000000 | measure ./odds.py -n > /dev/null
  ```

  ```python
  def odds_fp(stream=sys.stdin) -> Iterator[int]:
      return filter(lambda n: n % 2, map(int, stream))

  def odds_lc(stream=sys.stdin) -> list[int]:
      return [int(n) for n in stream if int(n) % 2]

  def odds_gr(stream=sys.stdin) -> Iterator[int]:
      for line in stream:
          number = int(line)
          if number % 2:
              yield number

  def odds_ge(stream=sys.stdin) -> Iterator[int]:
      return (n for n in map(int, stream) if n % 2)
  ```

  <div class="alert success-bg centered" markdown="1">

  **Generators** are typically **fast** and use **low memory**.

  </div>

  [Reading 05]: reading05.html

  ## Concurrency: <span class="gold">Overview</span>

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  #### <strong class="success">Concurrency</strong>

  - <strong class="warning">Composition</strong> of multiple tasks.

  - Requires <strong class="special">structure</strong>.

  </div>

  <div class="flex-col" markdown="1">

  #### <strong class="danger">Parallelism</strong>

  - Simultaneous <strong class="caution">execution</strong> of multiple tasks.

  - Requires <strong class="info">hardware resources</strong>.

  </div>

  </div>

  <div class="alert warning-bg centered" markdown="1">

  <strong class="success">Concurrency</strong> provides a way to <strong
  class="special">structure</strong> a solution to solve a problem that may (*but
  not necessarily*) be <strong class="danger">parallelizable</strong>.

  </div>

  <div class="alert caution-bg centered" markdown="1">

  **Example**: **pipelines**

  Single-core still process **pipeline** (**concurrency** without
  **parallelism**).

  </div>

  ## Concurrency: <span class="gold">Pitfalls</span>

  When we have multiple tasks executing <strong
  class="success">concurrently</strong>, we can encounter some <strong
  class="danger">problems</strong>:

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  - <strong class="warning">Race Condition</strong>: multiple tasks compete for
    the <strong class="caution">same resource</strong> in an **unpredictable
    manner**.

  - <strong class="danger">Deadlock</strong>: multiple tasks are stuck <strong
    class="warning">waiting</strong> for each other.

  </div>

  <div class="flex-col centered" markdown="1">

  <img src="https://upload.wikimedia.org/wikipedia/commons/2/23/Deadlock_at_a_four-way-stop.gif">

  </div>

  </div>

  <div class="alert info-bg" markdown="1">

  **Demonstration**: Athlete vs Band Member

  - **Race Condition**: In order to talk, they need to grab microphone.

  - **Deadlock**: In order to talk, they need to grab both microphone and water
  bottle.

  **Lesson from Covid**: **Isolate** and **Don't Share**!

  </div>

  ## Concurrency: <span class="gold">Embarrassingly Parallel</span>

  Some problems are so <strong class="caution">obviously parallel</strong>, that is they
  exhibit <strong class="warning">natural concurrency</strong>, that we label them as
  [embarrassingly parallel]:

  <div class="flex-row" markdown="1">

  <div class="flex-col centered" markdown="1">

  <img src="https://d2vfia6k6wrouk.cloudfront.net/productimages/74e8f739-cf99-4cad-bccd-b25f00affcce/images/2-pny-rtx-5090-argb-oc-epic-x-triple-fan-ra.png" width="300px" class="transparent">

  </div>

  <div class="flex-col centered" markdown="1">

  <img src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Hashcat-icon.png" class="transparent">

  </div>

  </div>

  - Little or no <strong class="danger">dependencies</strong> between tasks.

  - Little or no <strong class="danger">communication</strong> between tasks.

  [embarrassingly parallel]: https://en.wikipedia.org/wiki/Embarrassingly_parallel

  ## Concurrency: <span class="gold">hulk.py</span> (<i muted="class">Skit</i>)

  <div class="alert danger-bg centered" markdown="1">

  #### Sequential

  <img src="static/img/notebook16-hulk-sequential.svg" class="transparent responsive">

  We can perfrom each step **one at a time**.

  We can also perform each step **concurrently** (*task*).

  </div>

  <div class="alert success-bg centered" markdown="1">

  #### Parallel

  <img src="static/img/notebook16-hulk-parallel.svg" class="transparent responsive">

  We can further divide **crack** into indepdendent tasks (*data*).

  With aditional resources, we can achieve **parallelism**!

  </div>

  ## Concurrency: <span class="gold">Task Parallelism</span>

  <strong class="success">Generators</strong> support problems that exhibit
  [task parallelism]:

  <img src="static/img/slides16-task-parallelism.svg" class="transparent responsive">

  > <strong class="warning">Concurrent</strong> execution of the <strong
  > class="success">different tasks</strong> on same or different <strong
  > class="caution">datasets</strong>.

  <div class="alert warning-bg centered" markdown="1">

  In such situations, the <strong class="warning">different tasks</strong>
  usually must <strong class="danger">communicate</strong> and <strong
  class="danger">coordinate</strong> with each other.<br>The <strong
  class="warning">concurrent</strong> execution of such tasks are <strong
  class="special">interleaved</strong> throughout the execution of the
  application.

  </div>

  [task parallelism]: https://en.wikipedia.org/wiki/Task_parallelism

  ## Concurrency: <span class="gold">Data Parallelism</span>

  <strong class="success">Functional programming</strong> maps well to problems
  that exhibit [data parallelism]:

  <div class="centered">

  <img src="static/img/slides16-data-parallelism.svg" class="transparent responsive">

  </div>

  > <strong class="warning">Concurrent</strong> execution of the <strong
  > class="success">same task</strong> across the elements of a <strong
  > class="caution">dataset</strong>.

  <div class="alert warning-bg centered" markdown="1">

  In such situations, the <strong class="caution">dataset</strong> normally
  exhibits [data independence], meaning each element can be processed <strong
  class="special">independently</strong> of the other.

  </div>

  [data parallelism]: https://en.wikipedia.org/wiki/Data_parallelism
  [data independence]: https://en.wikipedia.org/wiki/Data_independence

  ## Example: [bench.py]

  Measure the **runtime** and **memory usage** of different versions of `odds.py`
  from [Reading 05] multiple times:

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  - <strong class="success">Sequential</strong>

  - <strong class="danger">Parallel</strong>

  </div>

  <div class="flex-col" markdown="1">

  <div class="alert warning-bg" markdown="1">

  1. Is this [embarrassingly parallel]?

  2. Does this exhibit [data parallelism]?

  3. Does this exhibit [task parallelism]?

  </div>

  </div>

  </div>

  ```python
  #!/usr/bin/env python3

  import concurrent.futures
  import functools
  import os
  import re

  # Constants

  ROUNDS   = 5
  VERSIONS = (
      ('iterative'    , '-i'),
      ('functional'   , '-f'),
      ('comprehension', '-l'),
      ('generator'    , '-g'),
  )

  # Functions

  def benchmark_once(flag):
      command = f'seq 10000000 | measure ./odds.py {flag} 2>&1 > /dev/null'
      return map(float, re.findall(r'([0-9\.]+)', os.popen(command).read()))

  def benchmark(name, flag):
      seconds_total = []
      memory_total  = []

      # Version 1: Sequential
      '''
      for _ in range(ROUNDS):
          seconds, memory = benchmark_once(flag)
          seconds_total.append(seconds)
          memory_total.append(memory)
      '''

      # Version 2: Parallel
      with concurrent.futures.ProcessPoolExecutor() as executor:
          for seconds, memory in executor.map(benchmark_once, [flag]*ROUNDS):
              seconds_total.append(seconds)
              memory_total.append(memory)

      seconds_average = sum(seconds_total) / ROUNDS
      memory_average  = sum(memory_total)  / ROUNDS
      print(f'{name:>15}: {seconds_average:8.2f}s {memory_average:8.2f}MB')

  # Main Execution

  def main():
      '''
      # Version 1: Sequential
      for name, flag in VERSIONS:
          benchmark(name, flag)
      '''

      # Version 2: Parallel
      with concurrent.futures.ProcessPoolExecutor() as executor:
          names = [v[0] for v in VERSIONS]
          flags = [v[1] for v in VERSIONS]
          executor.map(benchmark, names, flags)

  if __name__ == '__main__':
      main()
  ```

  [embarrassingly parallel]: https://en.wikipedia.org/wiki/Embarrassingly_parallel
  [data parallelism]: https://en.wikipedia.org/wiki/Data_parallelism
  [task parallelism]: https://en.wikipedia.org/wiki/Task_parallelism
  [bench.py]: https://github.com/nd-cse-20589-fa26/examples/blob/master/slides16/bench.py

  ## Concurrency: <span class="gold">Speedup</span>

  We can compute the <strong class="success">speedup</strong> of <strong
  class="danger">parallelism</strong> using the following formula:

  <div class="centered">

  <strong class="success">Speedup</strong> = <strong
  class="warning">Time<sub>sequential</sub></strong> / <strong
  class="danger">Time<sub>parallel</sub></strong>

  </div>

  **Example**:

  <div class="centered">

  <strong class="success">Speedup</strong> = <strong
  class="warning">48.982 s</strong> / <strong
  class="danger">4.411 s</strong> = <strong>11.10x</strong>

  </div>

  ## Concurrency: <span class="gold">Amdahl's Law</span>

  The <strong class="success">speedup</strong> of a program using multiple
  processes is <strong class="caution">limited</strong> by the time needed for
  the <strong class="warning">sequential portion</strong> of the problem.

  <div class="flex-row" markdown="1">

  <div class="flex-col" markdown="1">

  - If the program does not exhibit high amounts of <strong
    class="success">concurrency</strong>, then not much is gained with <strong
    class="danger">parallelism</strong>.

  - In other words, <strong class="success">speedup</strong> is limited in part
    by how much work we can <strong class="warning">divide up among different
    processes<strong class="warning">.

  </div>

  <div class="flex-col centered" markdown="1">

  <img src="https://upload.wikimedia.org/wikipedia/commons/e/ea/AmdahlsLaw.svg" class="responsive">

  </div>

  </div>
