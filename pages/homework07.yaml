  ### Task 2: Initial Import

  Now that the files are downloaded into the `homework07` folder, you can
  **commit** them to your [git] repository:

      :::bash
      $ git add Makefile                            # Mark changes for commit
      $ git add *.py
      $ git commit -m "Homework 07: Initial Import" # Record changes

  ### Task 3: Unit Tests

  After downloading these files, you can run the `make` command to run the
  tests.

      :::bash
      # Run all tests (will trigger automatic download)
      $ make

  You will notice that the Makefile downloads these additional test data and scripts:

      :::bash
      homework07
          \_ findit.test          # This is the Python test for the findit script

  In addition to the embedded [doctests] in the **skeleton code**, you will be
  using these [unit tests] to verify the correctness and behavior of your code.

  <div class="alert info-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "download" | embed_icon }}</i> Automatic Download

  The `test` scripts are automatically downloaded by the `Makefile`, so any
  modifications you do to them will be lost when you run `make` again. Likewise,
  because they are automatically downloaded, you do not need to `add` or `commit`
  them to your [git] repository.

  </div>

  The details on what you need to implement for this assignment are described
  in the following sections.

  ## Activity 2: findit (*0.8 Points*)

  For this activity, write a [Python] script, `findit.py`, that implements a
  subset of the [find] utility:

  ```bash
  # Display usage message
  $ ./findit.py
  Usage: findit ROOT [FILTERS]

  Filters:
      -type [f|d]     File is of type f for regular file or d for directory
      -name PATTERN   Name of file matches shell pattern
      -empty          File or directory is empty
      -readable       File is readable by user
      -writable       File is writable by user
      -executable     File is executable or directory is searchable by user

  # Display entries in current directory
  $ ./findit.py .
  .
  __pycache__
  findit.test
  findit.py
  findit.py.template
  Makefile
  answers.json
  __pycache__/findit.cpython-314.pyc

  # Display only files that end with .py
  $ ./findit.py . -type f -name *.py
  findit.py
  ```

  The `findit.py` takes a `ROOT` argument and then a series of *optional* `FILTERS`:

  - `-type [f|d]`: This allows the user to specify whether or not to search for
  [files] or [directories] (*note, cannot be a symlink*).

  - `-name PATTERN`: This allows the user to specify a *shell pattern* to match
  against the name of the file.

  - `-empty`: This allows the user to specify searching for empty [files] or
  [directories].

  - `-readable`: This allows the user to specify search for entries that are
  **readable** by the user.

  - `-writable`: This allows the user to specify search for entries that are
  **writable** by the user.

  - `-executable`: This allows the user to specify search for entries that are
  **executable** by the user.

  If multiple `FILTERS` are specified, then they all must match in order for
  the file or directory to be displayed.

  ### Task 1: `findit.py`

  To implement the `findit.py` script, you will need to use the [inheritance]
  and the [factory method pattern] discussed in class.

  [inheritance]: https://en.wikipedia.org/wiki/Inheritance_(object-oriented_programming)
  [factory method pattern]: https://en.wikipedia.org/wiki/Factory_method_pattern

  #### Filters

  Each of the command line `FILTERS` in `findit.py` corresponds to a specific
  `BaseFilter` class:

  ```python
  class BaseFilter(ABC):
      ''' Filter Interface'''
      @abstractmethod
      def check(self, path: Path) -> bool:
          pass
  ```

  As can be seen, the provided `BaseFilter` is an [abstract base class] which
  requires subclasses to implement the `check` [abstract method].  The purpose
  of this method is to return `True` if the given `path` passes the `FILTER`.

  You will need to implement each of the following **methods** in the
  corresponding **concrete** classes:

  -   <div class="flex-col" markdown="1">

          :::python
          class FilterFilter:
              def check(self, path: Path) -> bool:

      > This returns `True` if the given `path` is a regular **file** and not a **symlink**.

      <div class="alert success-bg" markdown="1">

      **Hint**: Use the methods of the [Path] object or a function in [os.path].

      </div>

  -   <div class="flex-col" markdown="1">

          :::python
          class DirectoryFilter:
              def check(self, path: Path) -> bool:

      > This returns `True` if the given `path` is a **directory** and not a **symlink**.

      <div class="alert success-bg" markdown="1">

      **Hint**: Use the methods of the [Path] object or a function in [os.path].

      </div>

  -   <div class="flex-col" markdown="1">

          :::python
          @dataclass
          class NameFilter:
              pattern: str
              def check(self, path: Path) -> bool:

      > This returns `True` if the name of given `path` matches stored shell **pattern**.

      <div class="alert success-bg" markdown="1">

      **Hint**: Use [fnmatch.fnmatch].

      </div>

  -   <div class="flex-col" markdown="1">

          :::python
          class EmptyFilter:
              def check(self, path: Path) -> bool:

      > This returns `True` if the given `path` is **empty** (*must be a file or directory, no symlink*).

      <div class="alert success-bg" markdown="1">

      **Hint**: Use the methods of the [Path] object or a function in
      [os.path].

      Think carefully on what it means for a **file** or **directory** to be
      empty.

      </div>

  -   <div class="flex-col" markdown="1">

          :::python
          class ReadableFilter:
              def check(self, path: Path) -> bool:

      > This returns `True` if the given `path` is **readable**.

      <div class="alert success-bg" markdown="1">

      **Hint**: Use [os.access].

      </div>

  -   <div class="flex-col" markdown="1">

          :::python
          class WritableFilter:
              def check(self, path: Path) -> bool:

      > This returns `True` if the given `path` is **writable**.

      <div class="alert success-bg" markdown="1">

      **Hint**: Use [os.access].

      </div>

  -   <div class="flex-col" markdown="1">

          :::python
          class ExecutableFilter:
              def check(self, path: Path) -> bool:

      > This returns `True` if the given `path` is **executable**.

      <div class="alert success-bg" markdown="1">

      **Hint**: Use [os.access].

      </div>

  [abstract base class]: https://docs.python.org/3/library/abc.html
  [abstract method]: https://docs.python.org/3/library/abc.html#abc.abstractmethod
  [Path]: https://docs.python.org/3/library/pathlib.html#concrete-paths
  [os.path]: https://docs.python.org/3/library/os.path.html
  [fnmatch.fnmatch]: https://docs.python.org/3/library/fnmatch.html#fnmatch.fnmatch
  [os.access]: https://docs.python.org/3/library/os.html#os.access

  #### Factory

  Once you have implemented the `Filter` classes, you are to complete the
  [factory method pattern]:

  -   <div class="flex-col" markdown="1">

          :::python
          class FilterFactory:
              @classmethod
              def get_filter(cls, arguments: list[str]) -> BaseFilter:

      > This returns the next concrete `Filter` class based on the given
      command line arguments (`raise UnknownFilter` if invalid argument).

      <div class="alert success-bg" markdown="1">

      **Hint**: You should consume at least one argument (and sometimes two
      depending on the `Filter`).

      </div>

  #### Walk

  You will use these `Filters` and the **factory method** in the following
  `walk` function:

  -   <div class="flex-col" markdown="1">

          :::python
          def walk(root: Path, filters: list[BaseFilter]) -> None:

      > This function prints `root` if it passes all `filters` and then
      recursively walks `root` and prints any entries that pass all
      `filters`.

      <div class="alert success-bg" markdown="1">

      **Hint**: Use [Path.walk] to perform the **walk**.  Consider using [all]
      with a **generator expression** to check all the `filters`.  You can also
      use [itertools.chain] to combine two separate **iterables** into a single
      sequence.

      </div>

  [Path.walk]: https://docs.python.org/3/library/pathlib.html#pathlib.Path.walk
  [all]: https://docs.python.org/3/builtins/functions.html#all
  [itertools.chain]: https://docs.python.org/3/library/itertools.html#itertools.chain

  #### Main Execution

  Finally, you will need to parse command line arguments and perform the `walk`:

  -   <div class="flex-col" markdown="1">

          :::python
          def main(arguments: list[str]=sys.argv[1:]:

      > This parses the command line arguments to get the `root` and `filters`,
      and then walks the `root` using the specified `filters`. '''

  ### Task 2: Testing

  As you implement `findit.py`, you can use the provided [doctests] to verify the
  correctness of your code:

      :::bash
      # Run doctests
      $ python3 -m doctest findit.py -v
      ...
      8 items passed all tests:
         1 test in findit.DirectoryFilter.check
         1 test in findit.EmptyFilter.check
         1 test in findit.ExecutableFilter.check
