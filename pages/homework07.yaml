title:      "Homework 07: Findit"
body:       |

  The goal of this homework assignment is to allow you to continue practicing
  [object-oriented programming] and using [system calls] related to [files] and
  [directories] in [Python] by implementing one a file system search utility
  similar to [find] named `findit.py`.

  For this assignment, record your scripts and any responses to the following
  activities in the `homework07` folder of your **assignments** [GitHub]
  repository and push your work by **noon Saturday, October 31**.

  [Python]: https://www.python.org/
  [object-oriented programming]: https://en.wikipedia.org/wiki/Object-oriented_programming
  [system calls]: https://en.wikipedia.org/wiki/System_call
  [files]: https://en.wikipedia.org/wiki/Computer_file
  [directories]: https://en.wikipedia.org/wiki/Directory_(computing)
  [find]: https://man7.org/linux/man-pages/man1/find.1.html

  ## Activity 0: Preparation

  Before starting this homework assignment, you should first perform a `git
  pull` to retrieve any changes in your remote [GitHub] repository:

      :::bash
      $ cd path/to/repository                   # Go to assignments repository

      $ git switch master                       # Make sure we are in master branch

      $ git pull --rebase                       # Get any remote changes not present locally

  Next, create a new branch for this assignment:

      :::bash
      $ git switch -c homework07                # Create homework07 branch and check it out

  ### Task 1: Skeleton Code

  To help you get started, the instructor has provided you with the following **skeleton code**:

      ::bash
      # Create homework07 folder
      $ mkdir homework07

      # Go to homework07 folder
      $ cd homework07

      # Download Makefile
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20589.fa26/static/txt/homework07/Makefile

      # Download Python skeleton code
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20589.fa26/static/txt/homework07/findit.py

  Once downloaded, you should see the following files in your `homework07` directory:

      :::bash
      homework07
          \_ Makefile       # This is the Makefile building all the assignment artifacts
          \_ findit.py      # This is the Python script for the findit script

  <div class="alert warning-bg" markdown="1">

