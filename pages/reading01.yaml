    ## Task 3: Reading


    The readings for **Wednesday, August 26** are:

    1. [Learning the Shell](https://linuxcommand.org/lc3_learning_the_shell.php)

    2. [A beginner's guide to Git version control](https://developers.redhat.com/articles/2023/08/02/beginners-guide-git-version-control)

    3. [GitHub Handbook](https://guides.github.com/introduction/git-handbook/)

    <div class="alert info-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "git" | embed_icon }}</i> Unix, Git, GitHub

    The focus of the readings is to review the basics of using the [Unix
    shell], which most of you used in **CSE 20311 Fundamentals of Computing**
    last semester, and to introduce you to [Git] and [GitHub], which we will be using
    throughout the semester.

    </div>

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "console" | embed_icon }}</i> The Hands-on Imperative

    To get the most out of your reading, you should be **typing** commands into
    a terminal and **playing** around with the things you reading.

    Passively reading will not be as fruitful as **actively** reading and
    trying out things you are exploring.

    </div>

