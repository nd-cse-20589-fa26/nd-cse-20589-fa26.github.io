title:  "Reading 01: Unix Shell, Git, Pipelines"
body:   |

    **Everyone**:

    Welcome to [CSE 20589 Software Systems], which (*as the syllabus states*)
    is a course that "introduces students to fundamental software development
    skills and concepts such as version control, scripting, testing, packaging,
    data processing, and networking".  Likewise, "students will practice
    applying these techniques by building a full stack application, where they
    will also explore programming paradigms such as functional programming,
    object-oriented programming, declarative programming, and event-based
    programming."  What this means is that students practice both **using**
    software systems and **building** them through hands-on assignments and a
    final course project.

    <div class="alert info-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "book" | embed_icon }}</i> TL;DR

    For this week, you need to join the class [Slack] channel, setup your
    [GitHub] repository, read about the [unix shell] and [git], and submit your
    responses to the [Reading 01 Quiz].

    </div>

    ## Course Overview

    <div class="flex-row" markdown="1">

    <div class="flex-col" markdown="1">

    Last year, most of you took the **CSE 20311 Fundamentals of Computing**
    course where you learned how to program in the [C] language. After *playing
    the Game of Life*, *generating anagrams*, and *building fractals*, you
    should be capable of programming in a compiled language using conditional
    statements, loops, and functions. Moreover, you should be somewhat familiar
    with [strings], [arrays], and [pointers].

    In this course, we will build on this foundational knowledge by exploring
    the [Unix] programming environment in order to get a better idea of how
    modern software systems work.  After learning how these systems work, we
    will build our own software systems using different [programming paradigms]
    such as [object-oriented programming] and [functional programming] while
    incorporating [software engineering] practices such as **version control**,
    **packaging**, **testing**, and **code review**.

    </div>

    <div class="flex-col-50 centered">
      <img src="static/img/house-of-cards.png" class="responsive" style="padding: 10px">
    </div>

    </div>

    The semester can be broken down into two halves:

    1. **Using Software Systems**: In the first half of the course, we will
    focus on learning **how to use** software systems effectively.  We will
    learn how to construct [unix pipelines] and how to write [Python] scripts
    to process data and access network resources.

    2. **Building Software Systems**: In the second half the course, we will
    build on our previous experience in using software systems to construct our
    own **full stack** software system. Specifically, we will construct a **web
    application** with a [REST] **back-end**, [SQLite] **database**, and
    interactive **front-end**.

    Each week there will be a **reading** assignment (*the first one is below*)
    meant to give you a context and reference into what we will be covering
    that upcoming week.  These will automatically be graded by the [continuous
    integration] system provided by [GitHub].

    During the first half of the semester, there is also a **homework**
    assignment each week that will provide you an opportunity apply the
    material in (*hopefully*) interesting ways.  In the second half of the
    course, however, you will instead work on a single **web application**
    project with multiple **milestones** that build off the previous stage of
    development.

    To assess your mastery of the concepts and skills in this class, there will
    be `3` in-class written **exams** (`2` during the first half and `1`
    comprehensive final).  Each exam will be on paper and will be "closed
    book", "closed notes", "closed computer", but "open mind".

    Finally, during the first half of the semester, there will be an in-person
    **interview** with a teaching assistant or with the instructor in the days
    before each **exam** where you will have the opportunity to demonstrate
    your knowledge of the project and to discuss what you learned from the
    experience.  In the second half of the course, these **interviews** are
    replaced by `3` **code reviews** where you will present the work you have
    completed on your **project** and discuss the concepts applied in the
    software system you are building.

