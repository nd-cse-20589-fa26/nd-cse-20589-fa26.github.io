title:      Interview 02
body:       |

    Next week, you will have the opportunity to demonstrate your mastery of the
    skills and concepts discussed in **Unit 01: Python Scripting** to the
    instructor or a teaching assistant in a `15` minute in-person **coding
    interview**.

    This interview will evaluate your proficiency in the following areas:

    1. **Filters and Pipelines**

    2.  <div class="flex-col" markdown="1">

        **Python Scripting**

        - **Functional Programming**

        - **List Comprehensions**

        - **Generator Expressions**

    More details of what you need to know about these particular areas can be
    found in [Checklist 02].

    ## Scheduling

    To schedule a **coding interview** appointment, put your **netid** (ie.
    `pbui`) in an open cell in a timeslot with an interviewer in the following:

    <div class="centered">
      <a href="https://docs.google.com/spreadsheets/d/1BmTD4KW2R4J2pFmU8PRO-xdDkuoDUQTBAnZzp_p9PMg/edit?usp=sharing" class="badge warning-btn" target="_new" style="font-size: 150%;">Interview 02 Spreadsheet</a>
    </div>

    The location of the interviewer can be found in the **Locations** tab of
    the [Interview 02 Spreadsheet].

    <div class="alert warning-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "calendar-clock" | embed_icon }}</i> Scheduling Deadline

    For planning purposes, please schedule your **Interview 02** appointment by
    **midnight, Friday, October 9**.

    You may only signup for **one** appointment timeslot.

    </div>

    [Interview 02 Spreadsheet]: https://docs.google.com/spreadsheets/d/1BmTD4KW2R4J2pFmU8PRO-xdDkuoDUQTBAnZzp_p9PMg/edit?usp=sharing
    [Checklist 02]: checklist02.html

    ## Sample Interview

    Here is an example of the types of tasks the interviewer mask ask you to
    perform:

    - <div class="flex-col" markdown="1">

        Create a new `practice02` folder in the assignments repository and go
        into it.

    - <div class="flex-col" markdown="1">

        Write a **pipeline** to list all the **unique users** with a
        **process** on the current system in (**ascending order** by name).

        <div class="alert caution-bg" markdown="1">

        **Note**: use `LC_ALL=C sort` when **ordering**.

        </div>

    - <div class="flex-col" markdown="1">

        Write a **Python** script called `practice02.py` that performs the same
        task.

        - Use [os.popen] for the first command in the **pipeline**.

        - Use at least **two** of the following: [functional programming], [list comprehensions], or [generator expressions].

        - Make sure output has **no duplicates** and is **ordered**.

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "lightbulb-outline" | embed_icon }}</i> Hints

    - You should be familiar with using [data structures] in [Python] such as
    [lists] and [dicts].

    - You should be familiar with using [os.popen] to read output from another program.

    - You should be familiar with using [map], [filter], and [lambda] to perform [functional programming].

    - You should be familiar with using [list comprehensions].

    - You should be familiar with using [generator expressions].

    - You should be familiar with using [with] to manage resources properly.

    - You should be familiar with identifying [data parallelism] and [task parallelism].

    </div>

    [os.popen]: https://docs.python.org/3/library/os.html#os.popen
    [data structures]: https://en.wikipedia.org/wiki/Data_structure
    [lists]: https://docs.python.org/3/library/stdtypes.html#list
    [dicts]: https://docs.python.org/3/library/stdtypes.html#dict
    [Python]: https://python.org
    [with]: https://docs.python.org/3/reference/compound_stmts.html#with
    [map]: https://docs.python.org/3/builtins/functions.html#map
    [filter]: https://docs.python.org/3/builtins/functions.html#filter
    [lambda]: https://docs.python.org/3/reference/expressions.html#lambda
    [functional programming]: https://en.wikipedia.org/wiki/Functional_programming
    [list comprehensions]: https://docs.python.org/3/tutorial/datastructures.html#list-comprehensions
    [generator expressions]: https://docs.python.org/3/reference/expressions.html#generator-expressions
    [data parallelism]: https://en.wikipedia.org/wiki/Data_parallelism
    [task parallelism]: https://en.wikipedia.org/wiki/Task_parallelism

    <div class="alert warning-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "alert" | embed_icon }}</i> Consulting Resources

    As with your **Reading** and **Homework** assignments, you are allowed to
    consult the course texts, slides, notes, the Internet, and even **AI
    tools**.  However, you cannot communicate with anyone else nor can you ask
    an **AI tool** to generate a solution.

    Be mindful that the interviewer is assessing your **proficiency** and how
    much you have **internalized**.  Over reliance on any external resource
    will be viewed **negatively** in regards to your **mastery** of the material.

    </div>

    [Checklist 01]: checklist01.html
