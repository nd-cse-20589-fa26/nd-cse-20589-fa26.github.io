title:      "Reading 06: Object-Oriented Programming, Processes"
body:       |

  **Everyone**:

  Next week, we will explore another programming paradigm called
  [object-oriented programming], which we have been using implicitly anytime we
  accessed *methods* or *attributes* of *objects* in [Python]:

  > **Object-oriented programming (OOP)** is a **programming paradigm** based on
  **objects** – software entities that **encapsulate data** and
  **function(s)**.

  Additionally, we dive deeper into the computing stack to understand how
  something like [concurrent.futures] works by examining [system calls] that
  create and manage [processes].

  <div class="alert info-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "book" | embed_icon }}</i> TL;DR

  The focus of this reading is to allow you to explore [object-oriented
  programming] and using [processes] with low-level [system calls] in [Python].

  </div>

  [system calls]: https://en.wikipedia.org/wiki/System_call
  [processes]: https://en.wikipedia.org/wiki/Process_(computing)
  [object-oriented programming]: https://en.wikipedia.org/wiki/Object-oriented_programming
  [concurrent.futures]: https://docs.python.org/3/library/concurrent.futures.html

  ## Readings

