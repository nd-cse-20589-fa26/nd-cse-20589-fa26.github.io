title:      Interview 03
body:       |

    Next week, you will have the opportunity to demonstrate your mastery of the
    skills and concepts discussed in since **Fall Break** to the
    instructor or a teaching assistant in a `15` minute in-person **coding
    interview**.

    This interview will evaluate your proficiency in the following areas:

    1. **Files**, **Directories**, **I/O**
    2. **Sockets**, **HTTP** (<b><i class="muted">Client, Server</i></b>)

    More details of what you need to know about these particular areas can be
    found in [Checklist 03].

    ## Scheduling

    To schedule a **coding interview** appointment, put your **netid** (ie.
    `pbui`) in an open cell in a timeslot with an interviewer in the following:

    <div class="centered">
      <a href="https://docs.google.com/spreadsheets/d/11ohLcAdFboHVvVmJWQGT7HutH6OBw2QFjG1wm3UFDYs/edit?usp=sharing" class="badge warning-btn" target="_new" style="font-size: 150%;">Interview 03 Spreadsheet</a>
    </div>

    The location of the interviewer can be found in the **Locations** tab of
    the [Interview 03 Spreadsheet].

    <div class="alert warning-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "calendar-clock" | embed_icon }}</i> Scheduling Deadline

    For planning purposes, please schedule your **Interview 03** appointment by
    **midnight, Friday, November 13**.

    You may only signup for **one** appointment timeslot.

    </div>

    [Interview 03 Spreadsheet]: https://docs.google.com/spreadsheets/d/11ohLcAdFboHVvVmJWQGT7HutH6OBw2QFjG1wm3UFDYs/edit?usp=sharing
    [Checklist 03]: checklist03.html

    ## Sample Interview

    Here is an example of the types of tasks the interviewer mask ask you to
    perform:

    - <div class="flex-col" markdown="1">

        Create a new `practice03` folder in the assignments repository and go
        into it.

    - <div class="flex-col" markdown="1">

        Use `curlit.py` from [Homework 08] to download `http_client.py` from
        [Slides 25] from the `bash` shell.

    - <div class="flex-col" markdown="1">

        Use `curlit.py` from [Homework 08] as a library to download
        `http_client.py` from [Slides 25] from a [Python] script.

    - <div class="flex-col" markdown="1">

        Modify `http_client.py` to perform the `DELETE` method.

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "lightbulb-outline" | embed_icon }}</i> Hints

    - You should have completed and be familiar with `curlit.py` from [Homework 08].

    - You should have completed and be familiar with `playlist_server.py` from [Homework 09].

    - You should be familiar with `http_client` from [Slides 25].

    - You should be familiar with [HTTP].

    - You should be familiar with [open].

    - You should be familiar with [os.chmod].

    </div>

    [Python]: https://python.org
    [Homework 08]: homework08.html
    [Homework 09]: homework09.html
    [Slides 25]: slides25.html
    [open]: https://docs.python.org/3/builtins/functions.html#open
    [os.chmod]: https://docs.python.org/3/library/os.html#os.chmod
    [HTTP]: https://en.wikipedia.org/wiki/HTTP

    <div class="alert warning-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "alert" | embed_icon }}</i> Consulting Resources

    As with your **Reading** and **Homework** assignments, you are allowed to
    consult the course texts, slides, notes, the Internet, and even **AI
    tools**.  However, you cannot communicate with anyone else nor can you ask
    an **AI tool** to generate a solution.

    Be mindful that the interviewer is assessing your **proficiency** and how
    much you have **internalized**.  Over reliance on any external resource
    will be viewed **negatively** in regards to your **mastery** of the material.

    </div>

    [git]: https://git-scm.com/
    [GitHub]: https://github.com/
    [curl]: https://curl.haxx.se/docs/manpage.html
    [wget]: http://man7.org/linux/man-pages/man1/wget.1.html
